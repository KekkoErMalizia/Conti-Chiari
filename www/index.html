/* --- avviso di aggiornamento (app Android): confronta il proprio numero di versione (build.json, scritto da GitHub
   quando costruisce l'APK) con quello della Release «android-latest». Android non permette di aggiornare da soli
   un'app installata da APK: l'avviso porta al download, poi si conferma l'installazione. --- */
let appBuild=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
async function checkUpdate(manual){
  if(!keepPlugin())return;   // solo nell'app Android (il plugin «Background» esiste solo lì)
  try{
    if(!appBuild)appBuild=await (await fetch('build.json',{cache:'no-store'})).json();
    if(!appBuild||!appBuild.build||!appBuild.repo)return;
    $('appVer').textContent=t('appVersion',{n:appBuild.build});$('appVer').hidden=$('updCheck').hidden=false;
    updState(+lsGet('cc-upd-latest')||0);   // subito, anche senza rete, con l'ultima versione già vista
    if(!manual&&Date.now()-(+lsGet('cc-upd-check')||0)<10*60e3)return;   // all'avvio e al ritorno nell'app, al massimo ogni 10 minuti
    lsSet('cc-upd-check',Date.now());
    const rel=await (await fetch(`https://api.github.com/repos/${appBuild.repo}/releases/tags/android-latest`,{cache:'no-store'})).json();
    const m=String(rel&&rel.body||'').match(/build:\s*(\d+)/),latest=m?+m[1]:0;
    if(latest){lsSet('cc-upd-latest',latest);updState(latest)}
    if(manual&&!(latest>appBuild.build))toast(t('updNone'));
  }catch(e){if(manual)toast(t('updFail'))}
}
// aggiornamento necessario: punto rosso su Impostazioni e finestra che obbliga ad aggiornare; spariscono con l'app aggiornata
let updLatest=0;
function updState(latest){
  const need=!!(appBuild&&latest>appBuild.build);updLatest=need?latest:0;
  $('updDot').hidden=!need;
  if(need&&+lsGet('cc-upd-notified')!==latest){lsSet('cc-upd-notified',latest);notifyMsg(t('updNotifTitle'),t('updNotifBody',{n:latest}),{chan:'update'},'aggiornamenti')}
  if(need)showUpdate();else $('updModal').hidden=true;
}
function showUpdate(){
  if(!updLatest)return;
  if(!$('tour').hidden)return setTimeout(showUpdate,400);   // appena il tutorial della prima apertura non è più visibile
  $('updInfo').textContent=t('updInfo',{n:updLatest,cur:appBuild.build});
  $('updGo').href=`https://github.com/${appBuild.repo}/releases/download/android-latest/ContiChiari.apk`;   // senza il plugin «Updater» si apre nel browser
  if(updater()&&!updBusy)$('updGo').textContent=t('updNow');
  $('updModal').hidden=false;
}
// «Aggiorna ora»: l'app scarica l'APK e apre subito l'installazione di Android (resta da toccare «Installa»)
const updater=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Updater;
let updBusy=false;
try{const U=updater();if(U)U.addListener('updateProgress',d=>{if(updBusy)$('updGo').textContent=t('updDownloading',{p:d.pct>=0?d.pct:'…'})})}catch(e){}
$('updGo').addEventListener('click',async e=>{
  const U=updater();if(!U)return;   // versioni senza il plugin: il link apre il browser
  e.preventDefault();if(updBusy)return;
  try{
    const can=await U.canInstall();
    if(!can.allowed){toast(t('updAllow'));await U.openInstallSettings();return}
    updBusy=true;$('updGo').textContent=t('updDownloading',{p:0});
    await U.downloadAndInstall({url:$('updGo').href});
  }catch(err){toast(t('updDlFail'));setTimeout(()=>{location.href=$('updGo').href},1500)}   // ripiego: download dal browser
  finally{updBusy=false;$('updGo').textContent=t('updNow')}
});
$('updCheck').onclick=()=>checkUpdate(true);
setTimeout(()=>checkUpdate(false),500);   // all'avvio, dopo l'eventuale apertura del tutorial (a 350 ms)
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')checkUpdate(false)});

const TOUR=[
  {t:'t1t',b:'t1b'},
  {sel:'#openGroups',tab:'mov',t:'t2t',b:'t2b'},
  {sel:'nav [data-tab=gruppo]',t:'t3t',b:'t3b'},
  {sel:'#fab',tab:'mov',t:'t4t',b:'t4b'},
  {sel:'nav [data-tab=saldi]',t:'t5t',b:'t5b'},
  {sel:'#q',tab:'mov',t:'t6t',b:'t6b'},
  {sel:'nav [data-tab=chat]',t:'t7t',b:'t7b'},
  {sel:'nav [data-tab=impostazioni]',t:'t8t',b:'t8b'},
  {t:'t9t',b:'t9b'}];
let tourI=0;
function tourShow(i){
  tourI=Math.max(0,Math.min(TOUR.length-1,i));const st=TOUR[tourI];
  if(st.tab&&tab!==st.tab)setTab(st.tab);
  $('tStep').textContent=t('tStep',{n:tourI+1,total:TOUR.length});
  $('tTitle').textContent=t(st.t);$('tBody').textContent=t(st.b);
  $('tDots').innerHTML=TOUR.map((_,k)=>`<i class="${k===tourI?'on':''}"></i>`).join('');
  $('tBack').hidden=tourI===0;$('tNext').textContent=t(tourI===TOUR.length-1?'tDone':'tNext');
  const ring=$('tRing'),card=$('tCard'),el=st.sel&&document.querySelector(st.sel);
  if(el&&el.getClientRects().length&&!el.closest('[hidden]')){
    const r=el.getBoundingClientRect(),pad=6;
    ring.classList.remove('none');
    Object.assign(ring.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
    const below=r.top+r.height/2<innerHeight/2;
    if(below){card.style.top=Math.min(innerHeight-260,r.bottom+18)+'px';card.style.bottom='auto'}
    else{card.style.bottom=Math.max(16,innerHeight-r.top+18)+'px';card.style.top='auto'}
  }else{ring.classList.add('none');card.style.top='auto';card.style.bottom='max(24px, calc(var(--bot) + 24px))'}
}
// il tutorial comincia con il video promozionale (saltabile); senza rete si parte subito con i passi
function tourOpen(){
  $('tRemember').checked=!!SET.tutorialDone;$('tour').hidden=false;tourShow(0);
  if(navigator.onLine===false)return tourStart();
  const v=$('tVideo');
  $('tour').classList.add('invideo');$('tVid').hidden=false;$('tVidSound').hidden=true;$('tVidBar').style.width='0';
  v.controls=false;v.muted=false;
  if(!v.src)v.src='video/ContiChiari-promo.mp4';
  try{v.currentTime=0}catch(e){}
  // senza un tocco dell'utente i browser avviano il video solo senza audio: allora mostra «Attiva audio»
  v.play().catch(()=>{v.muted=true;$('tVidSound').hidden=false;return v.play()}).catch(()=>{v.controls=true;$('tVidSound').hidden=true});   // autoplay bloccato del tutto: si avvia con i controlli del video
  $('tVidSkip').focus();
}
function tourStart(){
  const v=$('tVideo');v.pause();
  $('tVid').hidden=true;$('tour').classList.remove('invideo');
  if(!$('tour').hidden){tourShow(0);$('tNext').focus()}
}
const inVideo=()=>$('tour').classList.contains('invideo');
function tourClose(){
  SET.tutorialDone=$('tRemember').checked;saveSet();
  $('tVideo').pause();$('tVid').hidden=true;$('tour').classList.remove('invideo');
  $('tour').hidden=true;setTab('mov');
}

$('tSkip').onclick=tourClose;
$('tRing').onclick=()=>tourI===TOUR.length-1?tourClose():tourShow(tourI+1);   // toccare la zona evidenziata fa andare avanti
document.addEventListener('keydown',e=>{if($('tour').hidden)return;if(inVideo()){if(e.key==='Escape'||e.key==='ArrowRight')tourStart();return}if(e.key==='Escape')tourClose();if(e.key==='ArrowRight')$('tNext').click();if(e.key==='ArrowLeft'&&tourI>0)tourShow(tourI-1)});
addEventListener('resize',()=>{if(!$('tour').hidden)tourShow(tourI)});
$('openTour').onclick=tourOpen;
// sito aperto da iPhone/iPad e non ancora installato: pulsante con i passi per aggiungerlo alla schermata Home
(function(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  const installed=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(window.Capacitor||!ios||installed)return;
  const safari=!/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(navigator.userAgent);
  $('iosInstall').hidden=false;$('iosNotSafari').hidden=safari;
  $('iosInstall').onclick=()=>openSheet('iosSheet');
})();
// sito aperto da un telefono Android (non dall'app): link diretto all'APK della Release «android-latest» del repository
(function(){
  if(window.Capacitor||!/Android/i.test(navigator.userAgent)||!/\.github\.io$/.test(location.hostname))return;
  const owner=location.hostname.split('.')[0],repo=location.pathname.split('/')[1];if(!repo)return;
  const url=`https://github.com/${owner}/${repo}/releases/download/android-latest/ContiChiari.apk`;
  $('dlApk').href=$('apkGo').href=url;
  $('dlApk').hidden=$('dlApkHint').hidden=false;
  // prima del download, i passi da seguire (cache del Play Store, «Installa comunque»)
  $('dlApk').onclick=e=>{e.preventDefault();openSheet('apkSheet')};
  $('apkGo').onclick=()=>setTimeout(()=>closeSheet('apkSheet'),300);
  // l'APK è la strada consigliata: niente banner «Installa app» di Chrome (crea una WebAPK tramite il Play Store)
  window.addEventListener('beforeinstallprompt',ev=>ev.preventDefault());
})();
(function(){const m=location.hash.match(/^#chat=(.+)$/);if(m){history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>openChan(decodeURIComponent(m[1])),50)}})();
if(!SET.tutorialDone&&!CCSync.parseTicket(START_HASH)&&!CCSync.parseInvite(START_HASH)&&!CCSync.parseContact(START_HASH)&&!CCSync.parseShort(START_HASH)&&!/^#chat=/.test(START_HASH))setTimeout(tourOpen,350);

/* ---------- offline ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>

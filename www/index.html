<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Conti Chiari</title>
<meta name="description" content="Split group expenses and see who owes whom. Dividi le spese di gruppo.">
<meta name="theme-color" content="#1f5f6b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Conti Chiari">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/* Telefoni troppo vecchi: invece di una pagina bianca, un messaggio che spiega cosa aggiornare. Scritto in JavaScript vecchio apposta. */
(function(){
  // globalThis esiste solo da Chrome 71 / Safari 12.1: serve a lib/secp256k1.js (WebView di Android 7 con Chrome 67-70)
  if(typeof globalThis==='undefined')window.globalThis=window;
  var ok=typeof BigInt==='function'&&typeof Promise==='function'&&typeof TextEncoder==='function'&&window.crypto&&crypto.getRandomValues;
  if(ok)return;
  var it=(navigator.language||'').slice(0,2)==='it';
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  var msg=it?(ios?'Questo iPhone ha una versione di Safari troppo vecchia per Conti Chiari. Aggiorna iOS (Impostazioni \u2192 Generali \u2192 Aggiornamento software) e riapri la pagina.'
                 :'Questo telefono ha una versione di Chrome troppo vecchia per Conti Chiari. Aggiorna dal Play Store \u00abGoogle Chrome\u00bb e \u00abAndroid System WebView\u00bb, poi riapri l\u2019app.')
            :(ios?'This iPhone has a Safari version too old for Conti Chiari. Update iOS (Settings \u2192 General \u2192 Software Update) and reopen the page.'
                 :'This phone has a Chrome version too old for Conti Chiari. Update \u201cGoogle Chrome\u201d and \u201cAndroid System WebView\u201d from the Play Store, then reopen the app.');
  window.CC_OLD=true;
  document.addEventListener('DOMContentLoaded',function(){
    document.body.innerHTML='<div style="font:17px/1.5 sans-serif;padding:32px 24px;max-width:480px;margin:0 auto;color:#14262e;background:#eef2f1"><h1 style="font-size:22px">Conti Chiari</h1><p></p></div>';
    document.body.style.background='#eef2f1';
    document.body.getElementsByTagName('p')[0].appendChild(document.createTextNode(msg));
  });
})();
</script>
<style>
/* Layout: app a schermo intero — barra superiore col gruppo, contenuto scorrevole su sfondo personalizzabile, barra a cinque schede in basso */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#14262e; --muted:#5b6f76; --line:#d5dfdd;
  --accent:#1f5f6b; --accent-ink:#ffffff; --gold:#a8770a; --gold-soft:#f6ecd2;
  --pos:#1d7a4f; --neg:#b3402d; --chip:#e3ebea; --scrim:rgba(10,20,24,.45); --mine:#d9ecef;
  --bar:var(--surface);
  --f-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",sans-serif;
  --f-mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1a1e; --surface:#16252b; --ink:#e4eeed; --muted:#93a8ad; --line:#26393f;
  --accent:#5fb3bf; --accent-ink:#0b1619; --gold:#e3b54a; --gold-soft:#2c2614;
  --pos:#5cc795; --neg:#ef8a74; --chip:#20343a; --scrim:rgba(0,0,0,.6); --mine:#1d3b42; color-scheme:dark}}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}

#bgLayer{position:fixed;inset:0;z-index:0;background-color:var(--bg);background-size:cover;background-position:center}
body.custom-bg{--bar:var(--surface)}
body.custom-bg .top,body.custom-bg nav.tabs{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.custom-bg section{box-shadow:0 4px 18px rgba(0,0,0,.12)}

.top{padding:calc(var(--top) + 8px) 16px 12px;background:var(--bar);border-bottom:1px solid var(--line);display:grid;gap:6px}
/* nome dell'app al centro, seguito dall'icona, in una capsula con sfondo sfocato */
.brand{justify-self:center;display:flex;align-items:center;gap:7px;padding:4px 5px 4px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:14px;line-height:1;letter-spacing:.01em}
.brand img{display:block;width:22px;height:22px;border-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.brand .net{margin-inline:-2px 3px}
.trow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
@supports (align-items:last baseline){.trow{align-items:last baseline}}
.gbtn{all:unset;cursor:pointer;min-width:0;display:block}
.gbtn .nm{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.gbtn .nm span{overflow:hidden;text-overflow:ellipsis}
.gbtn .nm svg{flex:none;opacity:.6}
.gbtn:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.net{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net.on{background:var(--pos)}
.tot{text-align:end;flex:none}
.tot .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tot .cur{font-family:var(--f-mono);font-weight:700;font-size:12px;letter-spacing:0;text-transform:none;color:var(--ink);margin-inline-start:3px}
.tot .v{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}

main{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.view{max-width:640px;margin:0 auto;display:grid;gap:16px}
section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 .count{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 9px}
h2 .count:empty{display:none}
.empty{color:var(--muted);font-size:15px;margin:4px 0}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px}
.badge-line{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--pos)}

nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bar);border-top:1px solid var(--line);padding-bottom:var(--bot)}
nav.tabs button{all:unset;cursor:pointer;position:relative;display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;min-width:0}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:10px}
nav.tabs svg{width:24px;height:24px}
nav.tabs .unread{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
nav.tabs .unread:empty{display:none}

label.f{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:110px;font-family:var(--f-mono);font-size:13px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:600;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
a.btn{color:inherit;text-decoration:none}
/* aggiornamento obbligatorio: finestra al centro su sfondo sfocato e scurito al 30% */
.updmodal{position:fixed;top:0;right:0;bottom:0;left:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,20,24,.3);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.updcard{width:100%;max-width:420px;max-height:calc(100vh - 32px);overflow-y:auto;background:var(--surface);color:var(--ink);border-radius:20px;padding:20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:12px}
.updcard h3{margin:0;font-size:21px;text-align:center}
.updcard #updInfo{margin:0;text-align:center;color:var(--muted)}
.updcard .note{margin:0}
.updcard .iossteps{margin:0}
.updic{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;justify-self:center}
.updic svg{width:30px;height:30px}
/* punto rosso lampeggiante sulla scheda Impostazioni finché c'è un aggiornamento da installare */
.upddot{position:absolute;top:6px;left:calc(50% + 7px);width:10px;height:10px;border-radius:50%;background:var(--neg);box-shadow:0 0 0 2px var(--bar);animation:updBlink 1.1s ease-in-out infinite}
@keyframes updBlink{50%{opacity:.15;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.upddot{animation:none}}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.cthd{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.04em}
.cthd .count{font-family:var(--f-mono);font-size:12px;background:var(--chip);border-radius:999px;padding:0 8px}
.ctlist li{display:flex;align-items:center;gap:6px;min-width:0}
#ctBox{grid-template-columns:minmax(0,1fr);align-content:start}
#ctBox .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ctBox .row .btn{min-width:0;padding-inline:8px}
.ctlist li>button[data-ct]{flex:1;min-width:0}
.ctq{display:flex;gap:6px;flex:none}
.cthead{display:flex;gap:12px;align-items:center;margin:0 0 14px}
.cthead b{display:block}
.cthead span#ctStatus{display:block;font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.qrbox b{font-size:17px}
/* tasto «Scarica l'app Android»: contorno luminoso che pulsa con regolarità per attirare l'occhio */
#dlApk{position:relative}
#dlApk::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:0 0 0 4px var(--accent),0 0 22px 8px var(--accent);opacity:0;pointer-events:none;animation:apkGlow 2.2s ease-in-out infinite}
@keyframes apkGlow{50%{opacity:.45}}
@media (prefers-reduced-motion:reduce){#dlApk::after{animation:none}}
.iossteps{list-style:none;margin:4px 0 12px;padding:0;display:grid;gap:14px}
.iossteps li{display:flex;align-items:center;gap:14px;font-size:16px}
.iossteps .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center}
.iossteps .ic svg{width:24px;height:24px}
.iossteps .ic img{width:44px;height:44px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 130px;min-width:0}
.row>.btn{flex:0 0 auto}
.stack{display:grid;gap:12px}
.err{color:var(--neg);font-size:14px;margin:0}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted);margin:0}

.fab{position:fixed;inset-inline-end:16px;bottom:calc(var(--bot) + 76px);z-index:5;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}

/* movimenti */
.filters{display:grid;gap:10px}
.newgroup .row>*{flex:1 1 120px;min-width:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{min-height:56px;font-size:15.5px;line-height:1.2;padding:10px 12px}
.quick .btn svg{width:22px;height:22px}
#expForm[data-kind=pay] .only-exp,#expForm:not([data-kind=pay]) .only-pay{display:none}
.filters .row>*{flex:1 1 120px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.seg button:disabled{opacity:.4;cursor:default}
.sums{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.sums b{font-family:var(--f-mono)}
.exp{list-style:none;margin:0;padding:0}
.exp li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.exp li:first-child{border-top:0;padding-top:2px}
.exp .ic{grid-row:1/span 2;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--muted)}
.exp .ic svg{width:18px;height:18px}
.exp .ic.in{color:var(--pos)}
.exp .ic.out{color:var(--neg)}
.exp .d{font-weight:600;overflow-wrap:anywhere}
.exp .m{grid-column:2;font-size:13px;color:var(--muted)}
.exp .a{grid-row:1/span 2;grid-column:3;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end}
.exp .a small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.icon-btn{all:unset;cursor:pointer;grid-row:1/span 2;grid-column:4;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);font-size:22px}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.day{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.day:first-child{margin-top:0}

/* persone e avatar */
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding-block:4px;padding-inline:4px 4px;font-weight:500}
.person .nm{padding-inline-end:2px}
.person button{all:unset;cursor:pointer;color:var(--muted);padding:2px 9px;font-size:18px;line-height:1}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background-size:cover;background-position:center;overflow:hidden}
.av.lg{width:44px;height:44px;font-size:18px}
.av.xl{width:84px;height:84px;font-size:32px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.members{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.members li{display:flex;gap:12px;align-items:center}
.members .who{min-width:0}
.members .who b{display:block}
.members .who span{display:block;font-size:14px;color:var(--muted);overflow-wrap:anywhere}

/* divisione */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:15px;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.focus{outline:2px solid var(--accent);outline-offset:2px}
.chiprow{display:flex;justify-content:space-between;align-items:baseline}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.preview{font-size:14px;color:var(--muted);font-family:var(--f-mono)}
.amountwrap{position:relative}
.amountwrap .cur{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:14px;color:var(--muted);pointer-events:none}
.amountwrap input{padding-inline-end:56px}

/* saldi */
.bal{display:grid;gap:12px}
.b{display:grid;grid-template-columns:minmax(0,6.5em) 1fr auto;gap:10px;align-items:center;font-size:15px}
.b .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.b .bar{position:relative;height:10px;background:var(--chip);border-radius:5px;direction:ltr}
.b .bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.b .fill{position:absolute;top:0;bottom:0;border-radius:5px}
.b .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;min-width:6.5em;text-align:end;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.settle{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.settle li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.settle .who{font-weight:600}
.settle .arrow{color:var(--muted);font-size:14px}
.settle .amt{margin-inline-start:auto;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}

/* chat */
#v-chat{min-height:100%;grid-template-rows:auto 1fr auto}
.e2e{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.e2e svg{width:14px;height:14px}
.msgs{display:grid;gap:6px;align-content:end}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{margin-inline-start:auto;flex-direction:row-reverse}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px;min-width:0}
.msg.me .bub{background:var(--mine);border-color:transparent}
.msg .au{font-size:12px;font-weight:700;color:var(--accent)}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tm{font-size:11px;color:var(--muted);text-align:end}
.msg.cont .av{visibility:hidden}
.msg.cont .au{display:none}
.chathead{display:grid;gap:10px}
.chathead .row{align-items:center}
.ephsel{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 6px 4px 12px;flex:0 0 auto!important}
.ephsel svg{width:16px;height:16px;flex:none;color:var(--accent)}
.ephsel select{border:0;background:transparent;padding:4px 2px;font-size:14px;font-weight:600;width:auto}
.ephnote{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);text-align:center}
.ephnote svg{width:13px;height:13px}
.sysmsg{text-align:center;font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:5px 10px;justify-self:center;max-width:90%}
.dmhead{display:flex;align-items:center;gap:10px}
.chatdel{width:40px;height:40px;display:grid;place-items:center;color:var(--neg);flex:none}
.chatdel svg{width:21px;height:21px}
.dmhead .back{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--accent)}
.dmhead .back svg{width:24px;height:24px}
[dir=rtl] .dmhead .back svg{transform:scaleX(-1)}
.dmhead b{display:block}
.dmhead span{display:block;font-size:13px;color:var(--muted)}
.dmlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dmlist li{display:flex;align-items:center;gap:2px}
.dmlist button[data-peer]{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px}
.dmlist button[data-peer]:hover{background:var(--chip)}
.dmlist button[data-peer]:focus-visible{background:var(--chip)}
.dmlist .chatdel{opacity:.75}
.dmlist .chatdel:hover,.dmlist .chatdel:focus-visible{opacity:1;background:var(--chip)}
.dmlist .who{min-width:0;flex:1}
.dmlist .who b{display:block}
.dmlist .who span{display:block;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmlist .meta{display:grid;justify-items:end;gap:4px;font-size:12px;color:var(--muted)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:inline-grid;vertical-align:middle;box-sizing:border-box;place-items:center;padding:0 6px}
.msg .tm{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.ticks{display:inline-flex;width:18px;height:12px;color:var(--muted)}
.ticks.read{color:#2fa8e8}
.ticks svg{width:18px;height:12px}
.msg .eph{width:11px;height:11px;opacity:.7}
.members li[data-dm]{cursor:pointer;border-radius:12px}
.members li[data-dm]:hover{background:var(--chip)}
.seg .badge{margin-inline-start:4px}
.members .dmbtn{margin-inline-start:auto;flex:none}
.chatbar{position:sticky;bottom:-28px;padding-block:8px 28px;margin-bottom:-28px;display:flex;gap:8px;background:linear-gradient(transparent,var(--bg) 30%)}
body.custom-bg .chatbar{background:none}
.chatbar textarea{min-height:46px;max-height:140px;font-family:var(--f-body);font-size:16px;border-radius:22px;padding:11px 16px;resize:none;background:var(--surface)}
.chatbar .btn{border-radius:50%;width:46px;height:46px;padding:0;align-self:flex-end}

/* impostazioni */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 0 0 3px var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface),0 0 0 2px var(--accent)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.custom{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}
.custom input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px;cursor:pointer}
.palette{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.palette .pc{all:unset;cursor:pointer;aspect-ratio:1;border-radius:5px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.palette .pc[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);position:relative;z-index:1}
.palette .pc:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hex{width:6.2em;flex:none;margin-inline-start:auto;font-family:var(--f-mono);text-transform:uppercase}
.subh{margin:8px 0 0;font-size:15px}
.textures{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.tx{all:unset;cursor:pointer;display:grid;gap:4px;justify-items:center;font-size:12px;font-weight:600;color:var(--muted);text-align:center}
.tx i{display:block;width:100%;aspect-ratio:1;border-radius:10px;border:2px solid var(--line)}
.tx[aria-pressed="true"]{color:var(--ink)}
.tx[aria-pressed="true"] i{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.tx:focus-visible i{outline:2px solid var(--accent);outline-offset:2px}
.thumb{width:100%;aspect-ratio:16/10;max-width:100%;border-radius:12px;background:var(--chip) center/cover no-repeat;border:1px solid var(--line)}
.prof{display:flex;gap:16px;align-items:center}

/* aspetto: skin e chiaro/scuro */
.seg button svg{width:16px;height:16px;flex:none;vertical-align:-3px;margin-inline-end:4px}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.skin{all:unset;cursor:pointer;display:grid;gap:6px;justify-items:center;font-size:13px;font-weight:600;color:var(--muted);text-align:center;min-width:0}
.skin .mini{position:relative;width:100%;height:96px;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:var(--m-bg);display:grid;grid-template-rows:22px 1fr 16px}
.skin .mt{background:var(--m-surface);border-bottom:1px solid var(--m-line);display:grid;align-content:center;gap:2px;padding:0 7px}
.skin .mt i{display:block;height:3px;width:40%;border-radius:2px;background:var(--m-accent)}
.skin .mt i+i{height:5px;width:70%;background:var(--m-ink);opacity:.85}
.skin .mb{padding:6px;display:grid;gap:4px;align-content:start}
.skin .mb i{display:block;height:14px;border-radius:5px;background:var(--m-surface);border:1px solid var(--m-line)}
.skin .mb i:first-child{background:var(--m-accent);border-color:var(--m-accent);width:60%}
.skin .mn{background:var(--m-surface);border-top:1px solid var(--m-line);display:flex;justify-content:space-around;align-items:center}
.skin .mn i{width:6px;height:6px;border-radius:50%;background:var(--m-line)}
.skin .mn i:first-child{background:var(--m-accent)}
.skin .tick{position:absolute;top:5px;inset-inline-end:5px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:none;place-items:center}
.skin .tick svg{width:12px;height:12px}
.skin[aria-pressed="true"]{color:var(--ink)}
.skin[aria-pressed="true"] .mini{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.skin[aria-pressed="true"] .tick{display:grid}
.skin:focus-visible .mini{outline:2px solid var(--accent);outline-offset:3px}

/* QR */
.qrbox{display:grid;justify-items:center;gap:12px}
.qrbox canvas{width:240px;height:240px;max-width:100%;border-radius:12px;background:#fff;image-rendering:pixelated}
.scan{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

/* rinnovo chiave */
.rklist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rklist label{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.rklist input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.rklist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

/* codice a 6 cifre */
.pin{font-family:var(--f-mono);font-size:44px;font-weight:700;letter-spacing:.14em;text-align:center;margin:2px 0 0;direction:ltr;font-variant-numeric:tabular-nums}
.pin.off{color:var(--muted);text-decoration:line-through}
.pintime{text-align:center;margin:0;font-variant-numeric:tabular-nums}
.pinin{font-family:var(--f-mono);font-size:30px;text-align:center;letter-spacing:.2em;direction:ltr}
.pinreqs{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pinreqs li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}
.pinreqs .row{grid-column:1/-1}
.pinreqs .row .btn{flex:1}
.pinreqs .st{font-size:14px;color:var(--muted)}
.pinreqs .st.ok{color:var(--pos)}

/* gruppi */
.glist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.glist button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line)}
.glist button[aria-current="true"]{border-color:var(--accent);background:var(--chip)}
.glist button:focus-visible{outline:2px solid var(--accent)}
.glist .gm{font-size:13px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.glist .gn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:6px}

.sheet{position:fixed;inset:0;bottom:var(--kb,0px);z-index:20;display:grid;align-items:end;background:var(--scrim)}
.sheet .panel{background:var(--surface);border-radius:20px 20px 0 0;max-height:calc(100% - var(--top) - 24px);overflow-y:auto;padding:8px 16px calc(var(--bot) + 20px);width:100%;max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.confirm{display:grid;gap:10px;padding:12px;border:1px solid var(--neg);border-radius:12px}

.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* tutorial interattivo */
#tour{position:fixed;inset:0;z-index:40}
#tour .ring{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(4,14,17,.74),0 0 0 3px var(--gold);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:auto;cursor:pointer}
#tour .ring.none{left:50%!important;top:45%!important;width:0!important;height:0!important;box-shadow:0 0 0 9999px rgba(4,14,17,.8)}
#tour .skip{position:fixed;top:calc(var(--top) + 12px);inset-inline-end:14px;z-index:2;border:0;border-radius:999px;background:#fff;color:#14262e;font-weight:800;font-size:17px;padding:12px 20px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;cursor:pointer}
#tour .tvid{position:fixed;inset:0;z-index:3;background:#000;display:grid;place-items:center}
#tour .tvid video{width:100%;height:100%;object-fit:contain;background:#000}
#tour.invideo .ring,#tour.invideo .tcard,#tour.invideo #tSkip{visibility:hidden}
#tour .vsound{position:fixed;bottom:calc(var(--bot) + 28px);left:50%;transform:translateX(-50%);border:0;border-radius:999px;background:rgba(255,255,255,.92);color:#14262e;font:700 16px var(--f-body);padding:12px 20px;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tour .vsound:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#tour .vbar{position:fixed;left:0;right:0;bottom:var(--bot);height:4px;background:rgba(255,255,255,.2)}
#tour .vbar i{display:block;height:100%;width:0;background:var(--gold)}
#tour .skip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#tour .tcard{position:fixed;left:16px;right:16px;max-width:460px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:20px;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:grid;gap:10px;transition:top .35s,bottom .35s}
#tour .tcard h3{font-family:var(--f-display);font-size:21px;margin:0}
#tour .tcard p{margin:0;font-size:15.5px;color:var(--muted);line-height:1.45}
#tour .tstep{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#tour .dots{display:flex;gap:6px}
#tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#tour .dots i.on{background:var(--accent);width:18px;border-radius:4px}
#tour .tnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
#tour .remember{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer;padding-top:4px;border-top:1px solid var(--line)}
#tour .remember input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.vidwrap{width:100%;max-width:420px;margin:0 auto;aspect-ratio:9/16;max-height:calc(100vh - var(--top) - 160px);background:#000;border-radius:16px;overflow:hidden}
.vidwrap video{width:100%;height:100%;object-fit:contain;display:block}

/* ---------- accessibilità ---------- */
input.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
input.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input.switch:checked{background:var(--accent)}
input.switch:checked::after{transform:translateX(22px)}
[dir=rtl] input.switch:checked::after{transform:translateX(-22px)}
input.switch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.range{display:grid;gap:6px}
.range label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted)}
.range output{font-family:var(--f-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.subtle{display:grid;gap:12px;padding:12px;border-radius:12px;background:var(--chip)}
html.a-hc{--bg:#000;--surface:#000;--ink:#fff;--muted:#f0f0f0;--line:#fff;--accent:#ffd400;--accent-ink:#000;--chip:#1c1c1c;--gold:#ffd400;--gold-soft:#1c1c1c;--pos:#5dff9a;--neg:#ff7b7b;--mine:#262626;--bar:#000;color-scheme:dark}
html.a-hc section,html.a-hc .btn,html.a-hc input,html.a-hc select,html.a-hc textarea{border-width:2px}
html.a-hc :focus-visible{outline:3px solid #ffd400!important;outline-offset:3px}
html.a-hc .empty,html.a-hc .hint,html.a-hc .m{color:#fff}
html.a-big .btn,html.a-big button,html.a-big select,html.a-big input[type=text],html.a-big input[type=search]{min-height:48px}
html.a-big body{font-weight:500}
html.a-big nav.tabs button{font-size:12.5px}
html.a-cb-rg{--pos:#0072b2;--neg:#d55e00}
@media (prefers-color-scheme:dark){html.a-cb-rg{--pos:#56b4e9;--neg:#e69f00}}
html.a-cb-by{--pos:#117733;--neg:#cc3311;--gold:#aa3377;--gold-soft:#f6dce9}
@media (prefers-color-scheme:dark){html.a-cb-by{--pos:#44bb99;--neg:#ee6677;--gold:#ee99cc;--gold-soft:#3a2131}}
html.a-mono body{filter:grayscale(1)}
html.a-photo{--bg:#0b1012;--surface:#12191b;--ink:#c9d2d2;--muted:#86969a;--line:#223034;--accent:#6fa3ab;--accent-ink:#0b1012;--chip:#1a2427;--gold:#b8995a;--gold-soft:#221e14;--pos:#7fb894;--neg:#c98a7c;--mine:#18292d;--bar:#12191b;color-scheme:dark}
html.a-photo body{filter:brightness(.88)}
html.a-rm *,html.a-rm *::before,html.a-rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (min-width:700px){.fab{inset-inline-end:calc(50% - 300px)}}
/* Telefoni vecchi (2016 circa): colori semitrasparenti solo dove il browser li sa calcolare, misure fisse al posto di aspect-ratio */
@supports (color:color-mix(in srgb,red 50%,blue)){
  body.custom-bg{--bar:color-mix(in srgb,var(--surface) 86%,transparent)}
  .brand{border-color:color-mix(in srgb,var(--ink) 16%,transparent);background:color-mix(in srgb,var(--surface) 55%,transparent)}
  .exp .ic.in{background:color-mix(in srgb,var(--pos) 16%,transparent)}
  .exp .ic.out{background:color-mix(in srgb,var(--neg) 14%,transparent)}
}
@supports not (aspect-ratio:1){
  .thumb{height:56vw;max-height:260px}
  .scan{height:80vw;max-height:420px}
  .vidwrap{height:70vh}
}
</style>
</head>
<body>
<div id="bgLayer"></div>
<div class="app">
  <header class="top">
    <div class="brand"><b>Conti Chiari</b><img src="icons/icon.svg" alt=""><span class="net" id="netDot" hidden></span></div>
    <div class="trow">
      <button class="gbtn" id="openGroups" type="button">
        <div class="nm"><span id="gName"></span><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6l4 4 4-4"/></svg></div>
      </button>
      <div class="tot"><div class="lbl"><span data-t="total"></span><span class="cur" id="totalCur"></span></div><div class="v" id="total"></div></div>
    </div>
  </header>

  <main id="main">
    <!-- MOVIMENTI -->
    <div class="view" id="v-mov">
      <div class="note" id="sampleNote" data-t="sampleNote" hidden></div>
      <section class="quick">
        <button class="btn primary" type="button" data-add="exp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-t="qExp"></span></button>
        <button class="btn" type="button" data-add="pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg><span data-t="kindPay"></span></button>
      </section>
      <section class="filters">
        <input id="q" type="search" data-tp="searchPh" data-ta="search" autocomplete="off">
        <div class="row">
          <select id="fPerson" data-ta="filterPerson"></select>
          <select id="fPeriod" data-ta="period"></select>
        </div>
        <div class="seg" id="fDir" role="group">
          <button type="button" data-dir="all" data-t="dirAll"></button>
          <button type="button" data-dir="in" data-t="dirIn"></button>
          <button type="button" data-dir="out" data-t="dirOut"></button>
        </div>
        <div class="sums" id="sums"></div>
      </section>
      <section>
        <h2><span data-t="tabMov"></span><span class="count" id="expCount"></span></h2>
        <div id="expenses"></div>
      </section>
    </div>

    <!-- SALDI -->
    <div class="view" id="v-saldi" hidden>
      <section>
        <h2><span data-t="whoOwes"></span><span class="count" id="txCount"></span></h2>
        <ul class="settle" id="settle"></ul>
        <p class="hint" style="margin-top:10px" data-t="settleHint2"></p>
        <div class="row" style="margin-top:12px"><button class="btn" type="button" id="shareSummary" data-t="sendSummary"></button></div>
      </section>
      <section>
        <h2 data-t="balances"></h2>
        <div class="bal" id="balances"></div>
      </section>
    </div>

    <!-- CHAT -->
    <div class="view" id="v-chat" hidden>
      <div class="chathead" id="chatHead">
        <div class="seg" role="group" id="chatSeg">
          <button type="button" data-cv="group" data-t="chatGroup"></button>
          <button type="button" data-cv="list"><span data-t="chatPrivate"></span> <span class="badge" id="dmBadge" hidden></span></button>
          <button type="button" data-cv="contacts"><span data-t="ctTab"></span> <span class="badge" id="ctBadge" hidden></span></button>
        </div>
        <div class="dmhead" id="dmHead" hidden>
          <button class="back" type="button" id="dmBack" data-ta="back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
          <span id="dmAv"></span><div style="min-width:0;flex:1"><b id="dmName"></b><span id="dmSub"></span></div>
          <button class="icon-btn chatdel" type="button" id="dmDel" data-ta="delChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
        </div>
        <div class="row" id="ephRow" style="justify-content:space-between;gap:8px">
          <div class="e2e" id="e2e" style="flex:1 1 auto;justify-content:flex-start"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span id="e2eText" data-t="e2e"></span></div>
          <button class="icon-btn chatdel" type="button" id="chatDel" hidden data-ta="delChat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button><label class="ephsel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><select id="ephSel" data-ta="eph"></select></label>
        </div>
        <div class="ephnote" id="ephNote" hidden></div>
      </div>
      <div class="msgs" id="msgs"></div>
      <section id="dmListBox" hidden>
        <h2 data-t="privateTitle"></h2>
        <ul class="dmlist" id="dmList"></ul>
        <p class="hint" id="dmEmpty" data-t="privateEmpty" hidden></p>
      </section>

const PALETTE=(()=>{
  const hsl=(h,sat,l)=>{sat/=100;l/=100;const k=n=>(n+h/30)%12,a=sat*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(x*255).toString(16).padStart(2,'0')).join('')};
  const out=[];
  [94,86,76,64,50,36,22].forEach(l=>{for(let h=0;h<360;h+=30)out.push(hsl(h,l>80?70:l<30?55:75,l))});
  for(let i=0;i<12;i++)out.push(hsl(0,0,100-i*100/11));
  return out;
})();

const FALLBACK_CUR=COMMON_CUR.concat(['ARS','BGN','CLP','COP','HKD','IDR','ILS','ISK','KES','KWD','MYR','NGN','PEN','PHP','PKR','QAR','RSD','TWD','VND','BHD','OMR','JOD','TND','DZD','LKR','BDT','GEL','KZT','ALL','MKD','BAM','MDL']);
const ALL_CUR=(()=>{try{const l=Intl.supportedValuesOf('currency');if(l&&l.length)return l}catch(e){}return [...new Set(FALLBACK_CUR)].sort()})();
const REGION_CUR={US:'USD',GB:'GBP',CH:'CHF',JP:'JPY',CN:'CNY',CA:'CAD',AU:'AUD',IN:'INR',BR:'BRL',MX:'MXN',TR:'TRY',PL:'PLN',SE:'SEK',NO:'NOK',DK:'DKK',RO:'RON',CZ:'CZK',HU:'HUF',UA:'UAH',RU:'RUB',KR:'KRW',AE:'AED',SA:'SAR',ZA:'ZAR',EG:'EGP',MA:'MAD',TH:'THB',SG:'SGD',NZ:'NZD',AR:'ARS',CO:'COP',CL:'CLP',PE:'PEN',IL:'ILS',HK:'HKD',TW:'TWD',ID:'IDR',MY:'MYR',PH:'PHP',VN:'VND',NG:'NGN',KE:'KES',PK:'PKR',BD:'BDT',BG:'BGN',RS:'RSD',IS:'ISK'};
function guessCur(){const m=String(navigator.language||'').match(/-([A-Z]{2})\b/i);return (m&&REGION_CUR[m[1].toUpperCase()])||'EUR'}
const digitsCache={};
function curDigits(c){if(!(c in digitsCache)){try{digitsCache[c]=new Intl.NumberFormat('en',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits}catch(e){digitsCache[c]=2}}return digitsCache[c]}
const fmtCache={};
function fmt(minor,cur){
  cur=cur||G().cur||'EUR';const d=curDigits(cur),k=LOCALE+cur;
  if(!fmtCache[k]){try{fmtCache[k]=new Intl.NumberFormat(LOCALE,{style:'currency',currency:cur,currencyDisplay:'narrowSymbol'})}catch(e){fmtCache[k]=new Intl.NumberFormat(LOCALE,{style:'currency',currency:cur})}}
  return fmtCache[k].format(minor/10**d);
}
// importo senza simbolo della valuta (il simbolo sta nell'etichetta)
const numCache={};
function fmtNum(minor,cur){
  cur=cur||G().cur||'EUR';const d=curDigits(cur),k=LOCALE+cur;
  if(!numCache[k])numCache[k]=new Intl.NumberFormat(LOCALE,{minimumFractionDigits:d,maximumFractionDigits:d});
  return numCache[k].format(minor/10**d);
}
function curSymbol(cur){try{return new Intl.NumberFormat(LOCALE,{style:'currency',currency:cur,currencyDisplay:'narrowSymbol'}).formatToParts(0).find(p=>p.type==='currency').value}catch(e){return cur}}
function curName(c){try{return new Intl.DisplayNames([LOCALE],{type:'currency'}).of(c)}catch(e){return c}}
function parseAmount(s,d){
  s=String(s).trim().replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776)
    .replace(/[٫]/g,'.').replace(/[٬\s  ']/g,'').replace(/[^\d.,-]/g,'');
  if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){const dec=lc>ld?',':'.';s=s.split(dec==','?'.':',').join('').replace(dec,'.')}
  else if(lc>-1||ld>-1){const sep=lc>-1?',':'.',parts=s.split(sep);const thousands=parts.length>2||(parts[1].length===3&&d!==3);s=thousands?parts.join(''):parts[0]+'.'+parts[1]}
  const n=Number(s);return isFinite(n)&&n>=0?Math.round(n*10**d):NaN;
}

/* ---------- operazioni (stesse per gruppi locali e online) ---------- */
const isId=x=>typeof x==='string'&&x.length>0&&x.length<=64;
const isAmt=x=>Number.isInteger(x)&&x>0&&x<1e15;
const isDate=x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x);
function cleanPerson(p){return p&&isId(p.id)&&typeof p.name==='string'?{id:p.id,name:p.name.slice(0,24),color:/^#[0-9a-f]{6}$/i.test(p.color)?p.color:COLORS[0]}:null}
function cleanExp(e){return e&&isId(e.id)&&isAmt(e.amount)&&isId(e.payer)&&Array.isArray(e.split)&&e.split.length&&e.split.length<=200&&e.split.every(isId)?{id:e.id,desc:String(e.desc||'—').slice(0,60),amount:e.amount,payer:e.payer,split:[...new Set(e.split)],date:isDate(e.date)?e.date:today(),at:+e.at||0}:null}
function cleanPay(p){return p&&isId(p.id)&&isAmt(p.amount)&&isId(p.from)&&isId(p.to)&&p.from!==p.to?{id:p.id,from:p.from,to:p.to,amount:p.amount,date:isDate(p.date)?p.date:today(),at:+p.at||0}:null}
const AV_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function applyOp(g,op,pk){
  const ts=+op.ts||0,L=g.lww,D=g.dead;
  const up=(key,arr,obj)=>{if(!obj||(D[key]||0)>ts||(L[key]||0)>ts)return;L[key]=ts;const i=g[arr].findIndex(x=>x.id===obj.id);if(i>=0)g[arr][i]=obj;else g[arr].push(obj)};
  const rm=(key,arr,id)=>{if(!isId(id)||(L[key]||0)>ts)return;D[key]=Math.max(D[key]||0,ts);L[key]=ts;g[arr]=g[arr].filter(x=>x.id!==id)};
  switch(op.t){
    case 'meta': if((L.meta||0)<=ts){L.meta=ts;if(typeof op.name==='string'&&op.name.trim())g.name=op.name.slice(0,40);if(ALL_CUR.includes(op.cur))g.cur=op.cur}break;
    case 'person': up('p:'+(op.p&&op.p.id),'people',cleanPerson(op.p));break;
    case 'person-': rm('p:'+op.id,'people',op.id);break;
    case 'exp': up('e:'+(op.e&&op.e.id),'expenses',cleanExp(op.e));break;
    case 'exp-': rm('e:'+op.id,'expenses',op.id);break;
    case 'pay': up('y:'+(op.p&&op.p.id),'payments',cleanPay(op.p));break;
    case 'pay-': rm('y:'+op.id,'payments',op.id);break;
    case 'snap':
      if(op.name&&g.sync&&!g.sync.ownLock&&(!g.sync.ownTs||ts<g.sync.ownTs)){g.sync.owner=pk;g.sync.ownTs=ts;setTimeout(()=>retryClr(g),0)}
      if((L.meta||0)<=ts&&(op.name||op.cur)){L.meta=ts;if(typeof op.name==='string'&&op.name.trim())g.name=op.name.slice(0,40);if(ALL_CUR.includes(op.cur))g.cur=op.cur}
      (op.people||[]).forEach(p=>up('p:'+(p&&p.id),'people',cleanPerson(p)));
      (op.expenses||[]).forEach(e=>up('e:'+(e&&e.id),'expenses',cleanExp(e)));
      (op.payments||[]).forEach(p=>up('y:'+(p&&p.id),'payments',cleanPay(p)));
      break;
    case 'inv': if(CCSync.TK_RE.test(op.tk||'')&&+op.exp>0){g.tickets=g.tickets||{};if(!g.tickets[op.tk]){g.tickets[op.tk]={exp:+op.exp,used:0};setTimeout(watchTickets,0)}}break;
    case 'invUsed': if(CCSync.TK_RE.test(op.tk||'')){g.tickets=g.tickets||{};const T=g.tickets[op.tk]||(g.tickets[op.tk]={exp:+op.exp||0});T.used=1;setTimeout(()=>unwatchTicket(op.tk),0)}break;
    case 'msg': case 'rcpt': case 'eph': case 'clr': return applyChat(g,op,pk);
    case 'member': {
      const m=g.members[pk];
      if(pk!==ME.pk)setTimeout(()=>watchDM(pk),0);
      if(!m||m.ts<=ts)g.members[pk]={name:String(op.name||'').slice(0,24),status:String(op.status||'').slice(0,80),avatar:AV_RE.test(op.avatar||'')&&op.avatar.length<80000?op.avatar:'',personId:isId(op.personId)?op.personId:'',ts};
      break;}
  }
}

/* ---------- sincronizzazione ---------- */
const kv={get:k=>{try{return localStorage.getItem('cc-'+k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem('cc-'+k,v)}catch(e){}}};
const ME=CCSync.deviceKeys(kv);
let RELAYS;try{RELAYS=JSON.parse(localStorage.getItem('cc-relays'))}catch(e){}
let netCount=0;
const HUB=new CCSync.Hub({relays:Array.isArray(RELAYS)&&RELAYS.length?RELAYS:undefined,keys:ME,
  onOp:(gid,op,pk,createdAt)=>{
    if(gid.startsWith('tk:')){onTicketOp(gid.slice(3),op,pk,createdAt);return}
    if(gid.startsWith('tkok:')){onTkReply(gid.slice(5),op,pk);return}
    if(gid==='pin'){onPinReq(op,pk);return}
    if(gid==='pinok'){onPinReply(op,pk);return}
    if(gid==='inbox'){DB.inboxLast=Math.max(DB.inboxLast||0,createdAt);onFriendOp(op,pk);persistSoon();return}
    let ch,isDM=gid.startsWith('dm:');
    if(isDM){ch=ensureDM(gid.slice(3));if(pk!==ME.pk&&pk!==ch.peer)return;if(pk!==ME.pk&&isBlocked(pk)){ch.sync.last=Math.max(ch.sync.last||0,createdAt);return}}
    else{ch=DB.groups[gid];if(!ch||!ch.sync)return;if(op.t==='rekey'){onRekey(ch,op,pk);return}}
    const newExp=!isDM&&op.t==='exp'&&pk!==ME.pk&&op.e&&!ch.expenses.some(e=>e.id===op.e.id)&&!(ch.dead&&ch.dead['e:'+op.e.id]);
    const kind=isDM?applyChat(ch,op,pk):applyOp(ch,op,pk);
    if(newExp&&Date.now()/1000-createdAt<900&&!isBlocked(pk))expenseIn(ch,op.e.id,pk);   // solo spese recenti: niente raffica quando si scarica lo storico
    ch.sync.last=Math.max(ch.sync.last||0,createdAt);
    if(kind==='msg'&&pk!==ME.pk&&!isBlocked(pk))incoming(ch,gid,op,pk);
    persistSoon();if(isDM||gid===DB.current)renderSoon();
  },
  onStatus:n=>{netCount=n;renderNet()},
  onSent:id=>{
    if(DB.frOut&&DB.frOut.some(e=>e.id===id)){DB.frOut=DB.frOut.filter(e=>e.id!==id);persistSoon()}
    for(const ch of allChans()){
      if(ch.outbox&&ch.outbox.some(e=>e.id===id)){ch.outbox=ch.outbox.filter(e=>e.id!==id);persistSoon()}
      const m=ch.chat&&ch.chat.find(m=>m.ev===id);if(m&&!m.sent){m.sent=1;persistSoon();renderSoon()}
    }
  }
});
const allChans=()=>[...Object.values(DB.groups),...Object.values(DB.dms)];
const watchedDM=new Set();
async function watchDM(pk){
  if(!pk||pk===ME.pk||watchedDM.has(pk)||!/^[0-9a-f]{64}$/.test(pk))return;
  watchedDM.add(pk);
  try{const c=await CCSync.dmChannel(ME.sk,pk);const d=DB.dms[pk];if(d&&!d.sync)d.sync={key:c.key,topic:c.topic,last:0};DM_KEYS[pk]=c;HUB.watch('dm:'+pk,c.key,c.topic,d&&d.sync?d.sync.last:0)}catch(e){watchedDM.delete(pk)}
}
const DM_KEYS={};
function ensureDM(pk){
  let d=DB.dms[pk];
  if(!d){d=DB.dms[pk]={id:'dm:'+pk,peer:pk,chat:[],rcpt:{},lww:{},eph:86400,unread:0,outbox:[],sync:DM_KEYS[pk]?{key:DM_KEYS[pk].key,topic:DM_KEYS[pk].topic,last:0}:null}}
  return d;
}
function startSync(){
  let any=false;
  Object.values(DB.groups).forEach(g=>{if(g.sync&&!g.sync.owner&&!g.sync.ownScan){g.sync.ownScan=1;g.sync.last=0}});
  allChans().forEach(ch=>{if(ch.sync){any=true;if(ch.outbox&&ch.outbox.length)HUB.resend(ch.outbox)}});
  Object.values(DB.groups).forEach(g=>{if(g.sync){HUB.watch(g.id,g.sync.key,g.sync.topic,g.sync.last);Object.keys(g.members).forEach(watchDM)}});
  Object.keys(DB.dms).forEach(watchDM);
  // rubrica: chat private con i contatti e casella personale per le richieste di amicizia
  const hasContacts=Object.keys(DB.contacts).length>0;
  Object.keys(DB.contacts).forEach(pk=>{if(!isBlocked(pk))watchDM(pk)});
  if(any||hasContacts||DB.inboxOn){watchInbox();if(DB.frOut&&DB.frOut.length)HUB.resend(DB.frOut);any=true}
  if(watchTickets())any=true;
  DB.tkWait=(DB.tkWait||[]).filter(e=>e.until>Date.now());(DB.tkWait).forEach(watchTkReply);if(DB.tkWait&&DB.tkWait.length)any=true;
  if(any&&!HUB.started){HUB.started=true;HUB.start()}
}
function publish(ch,op){
  if(!ch.sync)return;
  if(!HUB.started)startSync();
  HUB.publish(ch.sync.key,ch.sync.topic,op).then(ev=>{
    (ch.outbox=ch.outbox||[]).push(ev);if(ch.outbox.length>500)ch.outbox.splice(0,ch.outbox.length-500);
    if(op.t==='msg'){const m=ch.chat.find(x=>x.id===op.id);if(m)m.ev=ev.id}
    persistSoon();
  }).catch(()=>{});
}
function commit(op,g=G()){
  op.id=op.id||CCSync.rid();op.ts=op.ts||Date.now();
  applyOp(g,op,ME.pk);g.updated=Date.now();delete g.sample;persist();
  const snd={exp:'success',person:'success','exp-':'delete','pay-':'delete','person-':'delete',pay:'pay',msg:'send'}[op.t];if(snd&&!op.quiet)fx(snd);
  publish(g,op);
}
function memberOp(g){const p=SET.profile;return {t:'member',name:p.name||'',status:p.status||'',avatar:p.avatar||'',personId:g.me||''}}
function snapOps(g){
  const ts=Date.now(),ops=[{t:'snap',ts,name:g.name,cur:g.cur,people:g.people}];
  for(let i=0;i<g.expenses.length;i+=120)ops.push({t:'snap',ts,expenses:g.expenses.slice(i,i+120)});
  for(let i=0;i<g.payments.length;i+=200)ops.push({t:'snap',ts,payments:g.payments.slice(i,i+200)});
  return ops;
}
async function goOnline(){
  let g=G();if(g.sync)return;
  if(g.sample){delete g.sample}
  // il gruppo d'esempio ha lo stesso id su tutti i telefoni: online prende un id nuovo, così non si mescola con l'esempio degli altri
  if(g.id==='esempio'){const nid=uid();delete DB.groups[g.id];g.id=nid;DB.groups[nid]=g;DB.current=nid}
  const key=CCSync.newGroupKey();
  g.sync={key,topic:await CCSync.topicOf(key),last:0,owner:ME.pk,ownLock:1};g.outbox=[];
  snapOps(g).forEach(op=>commit(op,g));
  commit(memberOp(g),g);
  startSync();render();toast(t('onlineOn'));
}
async function joinGroup(inv){
  closeSheet('scanSheet');closeSheet('groupSheet');stopScan();
  let g=DB.groups[inv.id];
  if(g&&g.sample&&!g.sync){delete DB.groups[inv.id];g=null}   // l'esempio non tocca un gruppo vero
  if(!g){
    g=blankGroup({id:inv.id,name:inv.name||t('myGroup'),cur:'EUR'});
    g.sync={key:inv.key,topic:await CCSync.topicOf(inv.key),last:0};g.outbox=[];
    DB.groups[g.id]=g;
  }else if(!g.sync){
    g.sync={key:inv.key,topic:await CCSync.topicOf(inv.key),last:0};g.outbox=[];
    if(inv.owner){g.sync.owner=inv.owner;g.sync.ownLock=1}
    snapOps(g).forEach(op=>commit(op,g));
  }
  if(inv.owner&&g.sync&&!g.sync.ownLock){g.sync.owner=inv.owner;g.sync.ownLock=1;retryClr(g)}
  DB.current=g.id;persist();startSync();
  commit(memberOp(g),g);
  render();setTab('gruppo');fx('scan');toast(t('joined',{name:g.name}));
}
/* ---------- rinnovo della chiave del gruppo ----------
   Chi ha creato il gruppo genera una chiave nuova e la manda, cifrata ECDH, solo ai membri che sceglie. L'annuncio
   viaggia sul vecchio argomento, ma chi ha solo la vecchia chiave vede buste che non può aprire. Poi tutti passano al
   nuovo argomento e ripubblicano il proprio stato; inviti e QR non usati smettono di valere. */
function canRekey(g){return !!(g&&g.sync&&(!g.sync.owner||g.sync.owner===ME.pk))}
async function switchKey(g,key,owner,keep){
  HUB.unwatch(g.sync.topic);
  // inviti in sospeso: chi li apre dopo trova subito «scaduto»
  const now=Date.now(),open=Object.entries(g.tickets||{}).filter(([,T])=>!T.used&&T.exp>now).map(([tk,T])=>[tk,T.exp]);
  if(g.qrTk&&!g.qrTk.used&&g.qrTk.exp>now)open.push([g.qrTk.tk,g.qrTk.exp]);
  open.forEach(([tk,exp])=>CCSync.ticketKeys(tk).then(({key,topic})=>HUB.publish(key,topic,{t:'tkUsed',ts:now,exp,x:1})).catch(()=>{}));
  Object.keys(g.tickets||{}).forEach(unwatchTicket);if(g.qrTk)unwatchTicket(g.qrTk.tk);
  g.tickets={};delete g.qrTk;
  g.sync={key,topic:await CCSync.topicOf(key),last:0,owner,ownLock:1};g.outbox=[];
  if(keep){const k=new Set(keep);Object.keys(g.members).forEach(pk=>{if(!k.has(pk))delete g.members[pk]})}
  persist();startSync();
  snapOps(g).forEach(op=>commit(op,g));commit(memberOp(g),g);   // il proprio stato sul nuovo argomento: niente si perde
  if(tab==='gruppo'&&G().id===g.id)qrTick(g.id);
  render();
}
function openRekey(){
  const g=G();if(!canRekey(g))return;
  const others=Object.entries(g.members).filter(([pk])=>pk!==ME.pk).sort((a,b)=>b[1].ts-a[1].ts);
  $('rkList').innerHTML=others.length?others.map(([pk,m])=>{const p=m.personId&&personIn(g,m.personId),nm=m.name||(p&&p.name)||t('anon');
    return `<li><label><input type="checkbox" checked data-rk="${pk}">${avatarHtml(nm,p?p.color:'#5b6f76',m.avatar)}<span class="nm">${esc(nm)}${p&&p.name!==nm?' · '+esc(p.name):''}</span></label></li>`}).join('')
    :`<li class="hint">${esc(t('rekeyAlone'))}</li>`;
  $('rkErr').textContent='';$('rkGo').disabled=false;openSheet('rekeySheet');
}
async function doRekey(){
  const g=G();if(!canRekey(g))return;
  if(!netCount){$('rkErr').textContent=t('rekeyNet');fx('error');return}
  $('rkGo').disabled=true;
  try{
    const keep=[...document.querySelectorAll('#rkList [data-rk]')].filter(x=>x.checked).map(x=>x.dataset.rk);
    const key=CCSync.newGroupKey(),env={};
    for(const pk of keep){const dm=await CCSync.dmChannel(ME.sk,pk);env[pk]=await CCSync.seal(dm.key,{k:key,id:g.id})}
    const owner=g.sync.owner||ME.pk;
    await HUB.publish(g.sync.key,g.sync.topic,{t:'rekey',id:CCSync.rid(),ts:Date.now(),env,owner});
    await switchKey(g,key,owner,keep.concat(ME.pk));
    closeSheet('rekeySheet');fx('success');toast(t('rekeyDone',{name:g.name}));
  }catch(e){$('rkErr').textContent=t('rekeyNet');$('rkGo').disabled=false}
}
async function onRekey(g,op,pk){
  if(pk===ME.pk||!op.env||typeof op.env!=='object')return;
  const owner=g.sync.owner;
  if(owner?pk!==owner:!g.members[pk])return;   // solo chi ha creato il gruppo (o, nei gruppi senza, un membro)
  if(g.sync.gone)return;
  const box=op.env[ME.pk];
  if(!box){g.sync.gone=1;persist();toast(t('rekeyOut',{name:g.name}));fx('error');renderSoon();return}
  try{
    const dm=await CCSync.dmChannel(ME.sk,pk),m=await CCSync.open(dm.key,box);
    if(!m||typeof m.k!=='string'||m.k.length<40)return;
    await switchKey(g,m.k,owner||pk,Object.keys(op.env).concat(pk));
    toast(t('rekeyGot',{name:g.name}));
  }catch(e){}
}
/* ---------- inviti monouso: link e QR ----------
   Link e QR contengono un biglietto casuale, non la chiave. Il primo che lo usa manda una richiesta; un membro online
   (per gli amici: io) gli risponde con la chiave cifrata solo per lui e brucia il biglietto su tutti i telefoni.
   I biglietti dei link sono condivisi coi membri del gruppo (op «inv»), quelli del QR restano su questo telefono,
   valgono 10 minuti e si rinnovano da soli, anche subito dopo ogni scansione. */
const QR_MIN=10,LINK_HOURS=24,TKW={};let TJ=null;
function ticketsOf(owner){
  if(owner==='me')return DB.myTickets=DB.myTickets||{};
  const g=DB.groups[owner];return g?(g.tickets=g.tickets||{}):null;
}
function ticketOf(owner,tk){const all=ticketsOf(owner);if(all&&all[tk])return all[tk];const q=qrOwner(owner);return q&&q.tk===tk?q:null}
function qrOwner(owner){if(owner==='me')return DB.myQr;const g=DB.groups[owner];return g&&g.qrTk}
async function watchTicket(tk,owner){
  if(TKW[tk])return;TKW[tk]={owner};
  const {key,topic}=await CCSync.ticketKeys(tk);if(!TKW[tk])return;
  TKW[tk].topic=topic;HUB.watch('tk:'+tk,key,topic,0);
}
function unwatchTicket(tk){const w=TKW[tk];if(!w)return;delete TKW[tk];clearTimeout(w.tm);if(w.topic)HUB.unwatch(w.topic)}
// ascolta i biglietti ancora validi; true se ce n'è almeno uno
function watchTickets(){
  const now=Date.now();let n=0;
  const each=(owner,tk,T)=>{if(!T)return;if(T.used||T.exp<=now){unwatchTicket(tk);return}n++;watchTicket(tk,owner)};
  Object.values(DB.groups).forEach(g=>{
    if(!g.sync)return;
    Object.entries(g.tickets||{}).forEach(([tk,T])=>{if(T.exp<now-864e5)delete g.tickets[tk];else each(g.id,tk,T)});
    if(g.qrTk)each(g.id,g.qrTk.tk,g.qrTk);
  });
  Object.entries(DB.myTickets||{}).forEach(([tk,T])=>{if(T.exp<now-864e5)delete DB.myTickets[tk];else each('me',tk,T)});
  if(DB.myQr)each('me',DB.myQr.tk,DB.myQr);
  if(n)hubOn();
  return n>0;
}
function beacon(owner,tk,exp){
  const b={t:'tkHost',ts:Date.now(),exp,name:(SET.profile.name||'').slice(0,24)};
  if(owner==='me')b.k='c';else{const g=DB.groups[owner];b.k='g';b.g=g.name.slice(0,40);b.gid=g.id}
  CCSync.ticketKeys(tk).then(({key,topic})=>HUB.publish(key,topic,b)).catch(()=>{});
}
// nuovo link monouso
function newLink(owner){
  const tk=CCSync.newTicket(),exp=Date.now()+LINK_HOURS*36e5;
  if(owner==='me'){DB.inboxOn=true;ticketsOf('me')[tk]={exp,used:0};persist()}
  else{const g=DB.groups[owner];if(!g||!g.sync)return '';commit({t:'inv',tk,exp},g)}
  hubOn();beacon(owner,tk,exp);watchTickets();startSync();
  return CCSync.ticketLink(tk);
}
// QR: un biglietto alla volta, 10 minuti; si rinnova se scade o se qualcuno lo ha usato
function qrTick(owner){
  const cv=owner==='me'?$('ctQr'):$('qr'),lab=owner==='me'?$('ctQrTime'):$('qrTime');
  const now=Date.now();let q=qrOwner(owner);
  if(owner!=='me'&&!(DB.groups[owner]&&DB.groups[owner].sync))return;
  if(!q||q.used||q.exp-now<1000){
    if(q){unwatchTicket(q.tk);if(!q.used){const old=q;CCSync.ticketKeys(old.tk).then(({key,topic})=>HUB.publish(key,topic,{t:'tkUsed',ts:Date.now(),exp:old.exp,x:1})).catch(()=>{})}}   // il QR sostituito non vale più
    q={tk:CCSync.newTicket(),exp:now+QR_MIN*6e4,used:0};
    if(owner==='me'){DB.myQr=q;DB.inboxOn=true}else DB.groups[owner].qrTk=q;
    persistSoon();hubOn();beacon(owner,q.tk,q.exp);watchTickets();startSync();
  }
  const link=CCSync.ticketLink(q.tk);if(cv.dataset.link!==link){drawQR(link,cv);cv.dataset.link=link}
  const sec=Math.ceil((q.exp-now)/1000);lab.textContent=t('qrRenews',{time:Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0')});
}
setInterval(()=>{
  if(document.hidden)return;
  if(tab==='gruppo'&&G().sync&&!$('inviteBox').hidden)qrTick(G().id);
  if(!$('myCodeSheet').hidden)qrTick('me');
},1000);
// qualcuno ha usato un mio biglietto
function onTicketOp(tk,op,pk,at){
  const w=TKW[tk];if(!w||!op)return;
  const T=ticketOf(w.owner,tk);if(!T)return;
  if(op.t==='tkUsed'){if(!T.used){T.used=1;persistSoon()}unwatchTicket(tk);return}
  if(op.t!=='tkReq'||pk===ME.pk||!/^[0-9a-f]{64}$/.test(pk)||isBlocked(pk))return;
  if(T.used){tkAnswer(tk,pk,{t:'tkNo'});return}
  if(at*1000>T.exp+60000)return;
  (w.cands=w.cands||[]).push({pk,op,at});
  clearTimeout(w.tm);w.tm=setTimeout(()=>ticketDecide(tk),1500);   // se arrivano più richieste insieme vince la prima
}
async function tkAnswer(tk,pk,op){
  try{
    const now=Date.now(),dm=await CCSync.dmChannel(ME.sk,pk),rt=await CCSync.ticketReply(tk,pk);
    await HUB.publish(dm.key,rt,Object.assign({ts:now,exp:now+7*864e5},op));
  }catch(e){}
}
async function ticketDecide(tk){
  const w=TKW[tk];if(!w||!w.cands||!w.cands.length)return;
  const T=ticketOf(w.owner,tk);if(!T)return;
  const cands=w.cands.sort((a,b)=>a.at-b.at||(a.pk<b.pk?-1:1));w.cands=[];
  if(T.used){cands.forEach(c=>tkAnswer(tk,c.pk,{t:'tkNo'}));return}
  const c=cands[0],name=String(c.op.name||'').trim().slice(0,24)||t('anon');
  let l;
  if(w.owner==='me'){
    l=CCSync.contactLink(ME.pk,SET.profile.name||'');
    const ct=ensureContact(c.pk),now=Date.now();if(!ct.name)ct.name=name;
    if(!ct.avatar&&AV_RE.test(c.op.avatar||'')&&c.op.avatar.length<80000)ct.avatar=c.op.avatar;
    if(!ct.blocked&&(ct.rel==='none'||ct.rel==='in')){ct.rel=ct.rel==='in'?'friend':'out';ct.ts=now;frSend(c.pk,ct.rel==='friend'?'acc':'req');watchDM(c.pk);renderUnread()}
  }else{const g=DB.groups[w.owner];if(!g||!g.sync)return;l=CCSync.inviteLink(g)}
  // brucia il biglietto: su questo telefono, per gli altri membri e per chi riprova lo stesso link
  T.used=1;persist();
  const g=w.owner==='me'?null:DB.groups[w.owner];
  if(g&&!(g.qrTk&&g.qrTk.tk===tk))commit({t:'invUsed',tk,exp:T.exp},g);
  const {key,topic}=await CCSync.ticketKeys(tk);
  HUB.publish(key,topic,{t:'tkUsed',ts:Date.now(),exp:T.exp}).catch(()=>{});
  await tkAnswer(tk,c.pk,{t:'tkOk',l});
  cands.slice(1).forEach(x=>tkAnswer(tk,x.pk,{t:'tkNo'}));
  setTimeout(()=>unwatchTicket(tk),20000);   // ancora un po' in ascolto, per rispondere «già usato» a chi arriva tardi
  fx('success');toast(t(w.owner==='me'?'tkFriendIn':'tkGroupIn',{name}));
  if(w.owner==='me'){if(!$('myCodeSheet').hidden)qrTick('me')}else if(tab==='gruppo'&&G().id===w.owner)qrTick(w.owner);
  renderSoon();
}

    if(!b){tkFail(netCount?'tkNotFound':'pinOffline');return}

    const e={tk,k:b.k,host:b.$pk,until:Math.min(+b.exp+864e5,Date.now()+7*864e5)};
    tkWaitDrop(tk);(DB.tkWait=DB.tkWait||[]).push(e);persist();watchTkReply(e);
    const now=Date.now();
    await HUB.publish(key,topic,Object.assign({t:'tkReq',ts:now,exp:+b.exp},myCard()));

/* ---------- calcoli ---------- */
function shares(e){const n=e.split.length,b=Math.floor(e.amount/n),r=e.amount-b*n;return e.split.map((id,i)=>[id,b+(i<r?1:0)])}
function balances(g=G()){
  const b={};g.people.forEach(p=>b[p.id]=0);
  g.expenses.forEach(e=>{if(!(e.payer in b)||!e.split.length)return;b[e.payer]+=e.amount;shares(e).forEach(([id,c])=>{if(id in b)b[id]-=c})});
  g.payments.forEach(p=>{if(p.from in b&&p.to in b){b[p.from]+=p.amount;b[p.to]-=p.amount}});
  return b;
}
function settle(b){
  const cr=[],db=[];
  Object.entries(b).forEach(([id,v])=>{if(v>0)cr.push([id,v]);else if(v<0)db.push([id,-v])});
  const tx=[];
  while(cr.length&&db.length){
    cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
    const c=cr[0],d=db[0],m=Math.min(c[1],d[1]);
    tx.push({from:d[0],to:c[0],amount:m});c[1]-=m;d[1]-=m;if(!c[1])cr.shift();if(!d[1])db.shift();
  }
  return tx;
}
const groupTotal=g=>g.expenses.reduce((s,e)=>s+e.amount,0);

/* ---------- avatar ---------- */
function memberFor(g,personId){let best=null;for(const[pk,m]of Object.entries(g.members))if(m.personId===personId&&(!best||m.ts>best.ts))best=Object.assign({pk},m);return best}
function avatarHtml(name,color,img,cls=''){

}
function personAvatar(g,p,cls){
  if(p.id===g.me&&SET.profile.avatar)return avatarHtml(p.name,p.color,SET.profile.avatar,cls);
  const m=memberFor(g,p.id);return avatarHtml(p.name,p.color,m&&m.avatar,cls);
}

/* ---------- codice di condivisione (senza server) ---------- */
function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function encodeGroup(g){const{id,name,cur,people,expenses,payments}=g;return 'CC1:'+b64enc(JSON.stringify({id,name,cur,people,expenses,payments}))}
function decodeGroup(code){
  const m=String(code).replace(/\s/g,'').match(/CC1:([A-Za-z0-9_-]+)/);
  if(!m)throw new Error(t('errCodeInvalid'));
  let g;try{g=JSON.parse(b64dec(m[1]))}catch(e){throw new Error(t('errCodeIncomplete'))}

function applyChat(ch,op,pk){
  const ts=+op.ts||0;ch.rcpt=ch.rcpt||{};ch.lww=ch.lww||{};
  if(op.t==='clr'){
    // chat privata: può cancellarla chiunque dei due; chat di gruppo: solo chi ha creato il gruppo online
    if(!ch.peer){
      const own=ch.sync&&ch.sync.owner;
      if(!own){(ch.pendClr=ch.pendClr||[]).push({pk,ts});return}
      if(pk!==own)return;
    }
    if(!(ts>0)||ts>Date.now()+600000||(ch.clr||0)>=ts)return;
    ch.clr=ts;ch.chat=ch.chat.filter(m=>m.ts>ts);
    Object.keys(ch.rcpt).forEach(id=>{if(!ch.chat.some(m=>m.id===id))delete ch.rcpt[id]});
    ch.unread=0;return 'clr';
  }
  if(op.t==='msg'){
    if(!isId(op.id)||typeof op.text!=='string'||!op.text.trim()||ch.chat.some(m=>m.id===op.id))return;
    if(ch.clr&&(+op.ts||0)<=ch.clr)return;
    const exp=+op.exp||0;if(exp&&exp<Date.now())return;
    ch.chat.push({id:op.id,from:pk,text:op.text.slice(0,1000),ts,exp:exp||undefined,sent:pk===ME.pk?0:1});
    ch.chat.sort((a,b)=>a.ts-b.ts);if(ch.chat.length>2000)ch.chat.splice(0,ch.chat.length-2000);
    return 'msg';
  }
  if(op.t==='rcpt'){
    ['d','r'].forEach(k=>(Array.isArray(op[k])?op[k]:[]).slice(0,500).forEach(id=>{
      const m=ch.chat.find(x=>x.id===id);if(!m||m.from!==ME.pk||pk===ME.pk)return;
      const r=ch.rcpt[id]=ch.rcpt[id]||{d:{},r:{}};r.d[pk]=r.d[pk]||ts;if(k==='r')r.r[pk]=r.r[pk]||ts;
    }));return 'rcpt';
  }
  if(op.t==='eph'){
    const v=Math.max(0,Math.min(86400,+op.s||0));if((ch.lww.eph||0)>ts)return;ch.lww.eph=ts;
    if(ch.eph!==v){ch.eph=v;if(isId(op.id)&&!ch.chat.some(m=>m.id===op.id))ch.chat.push({id:op.id,from:pk,sys:'eph',s:v,ts});ch.chat.sort((a,b)=>a.ts-b.ts)}
    return 'eph';
  }
}

  else if(op.a==='dec'||op.a==='rem')c.rel='none';
  else return;
  c.ts=ts;watchDM(pk);renderSoon();renderUnread();
  if(op.a==='req'&&prev==='out')frSend(pk,'acc');   // richieste incrociate: diventate amici
  const name=nameOf(pk);
  if(c.rel==='in'&&prev!=='in'){fx('receive');notifyMsg(t('ctTab'),t('frReqBody',{name}),{chan:'contacts'})}
  else if(c.rel==='friend'&&prev==='out'){fx('success');notifyMsg(t('ctTab'),t('frAccBody',{name}),{chan:'contacts'})}
}
function frAction(pk,act){

  if(act==='remove'&&!confirm(t('frRemoveQ',{name})))return;
  if(act==='block'&&!confirm(t('frBlockQ',{name})))return;
  switch(act){
    case 'ask': c.rel=c.rel==='in'?'friend':'out';c.ts=now;frSend(pk,c.rel==='friend'?'acc':'req');toast(t(c.rel==='friend'?'frNowFriends':'frSent',{name}));break;
    case 'accept': c.rel='friend';c.ts=now;frSend(pk,'acc');fx('success');break;
    case 'decline': c.rel='none';c.ts=now;frSend(pk,'dec');break;
    case 'cancel': case 'remove': c.rel='none';c.ts=now;frSend(pk,'rem');fx('delete');break;
    case 'block': if(c.rel!=='none')frSend(pk,'rem');c.rel='none';c.blocked=true;c.ts=now;fx('delete');break;
    case 'unblock': c.blocked=false;c.ts=now;break;
    default: return;
  }
  DB.inboxOn=true;watchDM(pk);persist();startSync();
  renderUnread();renderChat();if(!$('ctSheet').hidden)openContact(pk);
}

const LNP=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;

const NOTIFY=()=>window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Notify;

async function notifChannels(){

// nell'app la notifica va sempre nella barra del telefono, con l'icona di Conti Chiari (anche ad app aperta, se non si sta guardando quella chat)
async function notifyMsg(title,body,data,channel='messaggi'){

    if(!('Notification' in window)||Notification.permission!=='granted')return;
    const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
    const opts={body:String(body).slice(0,200),icon:'icons/icon-192.png',badge:'icons/icon-192.png',tag:data.chan,renotify:true,data};
    if(reg)reg.showNotification(title,opts);else new Notification(title,opts);

function drawQR(text,cv=$('qr')){
  const qr=qrcode(0,'M');qr.addData(text);qr.make();
  const n=qr.getModuleCount(),q=4,size=n+q*2,scale=Math.floor(480/size)||1;
  cv.width=cv.height=size*scale;const c=cv.getContext('2d');
  c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.fillStyle='#0f2a30';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect((k+q)*scale,(r+q)*scale,scale,scale);
}

function getPhoto(){if(photoCache===undefined){try{photoCache=localStorage.getItem(PKEY)||null}catch(e){photoCache=null}}return photoCache}
// sfondo a colore: colore pieno o sfumatura, con una texture opzionale sopra (tutto in CSS, niente immagini da salvare)
function hexRgb(h){const m=/^#?([0-9a-f]{6})$/i.exec(h||'');const n=m?parseInt(m[1],16):0xd6ece2;return[n>>16,n>>8&255,n&255]}
function texLayers(k,c,s){
  // ogni texture: [immagine, dimensione del riquadro che si ripete]
  const h=s/2;
  switch(k){
    case 'dots':return[[`radial-gradient(${c} ${Math.max(1,s/10)}px,transparent ${Math.max(1.5,s/10+.8)}px)`,`${s}px ${s}px`]];
    case 'grid':return[[`linear-gradient(${c} 1px,transparent 1px)`,`${s}px ${s}px`],[`linear-gradient(90deg,${c} 1px,transparent 1px)`,`${s}px ${s}px`]];
    case 'stripes':return[[`repeating-linear-gradient(45deg,${c} 0,${c} ${h/2}px,transparent ${h/2}px,transparent ${h}px)`,'auto']];
    case 'hatch':return[[`repeating-linear-gradient(45deg,${c} 0,${c} 1px,transparent 1px,transparent ${h}px)`,'auto'],[`repeating-linear-gradient(-45deg,${c} 0,${c} 1px,transparent 1px,transparent ${h}px)`,'auto']];
    case 'checks':return[[`linear-gradient(45deg,${c} 25%,transparent 25%,transparent 75%,${c} 75%)`,`${s}px ${s}px`],[`linear-gradient(45deg,${c} 25%,transparent 25%,transparent 75%,${c} 75%)`,`${s}px ${s}px`,`${h}px ${h}px`]];
    case 'zigzag':return[[`linear-gradient(135deg,${c} 25%,transparent 25%)`,`${s}px ${s}px`,`-${h}px 0`],[`linear-gradient(225deg,${c} 25%,transparent 25%)`,`${s}px ${s}px`,`-${h}px 0`],[`linear-gradient(315deg,${c} 25%,transparent 25%)`,`${s}px ${s}px`],[`linear-gradient(45deg,${c} 25%,transparent 25%)`,`${s}px ${s}px`]];
    case 'linen':return[[`repeating-linear-gradient(0deg,${c} 0,${c} 1px,transparent 1px,transparent ${Math.max(3,s/5)}px)`,'auto'],[`repeating-linear-gradient(90deg,${c} 0,${c} 1px,transparent 1px,transparent ${Math.max(4,s/4)}px)`,'auto']];
    case 'noise':{const f=(2.4/Math.sqrt(s)).toFixed(2),svg=`<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='${f}' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 ${c.r} 0 0 0 0 ${c.r} 0 0 0 0 ${c.r} ${(c.a*3).toFixed(3)} 0 0 0 -${(c.a*.6).toFixed(3)}'/></filter><rect width='100%' height='100%' filter='url(#n)'/></svg>`;return[[`url("data:image/svg+xml,${encodeURIComponent(svg)}")`,'200px 200px']]}
  }
  return[];
}
function bgCss(bg,asText){
  const base=bg.color||'#d6ece2',[r,g,b]=hexRgb(base),light=(r*299+g*587+b*114)/1000>140;
  // la texture è scura sui colori chiari e chiara su quelli scuri
  const a=(bg.texStrength??30)/100*(light?.22:.3),tc=`rgba(${light?'0,0,0':'255,255,255'},${a.toFixed(3)})`;
  const c=bg.tex==='noise'?{r:light?0:1,a}:tc;
  const layers=bg.tex&&bg.tex!=='none'?texLayers(bg.tex,c,bg.texSize||20):[];
  const ang=bg.angle??135;
  if(bg.grad==='linear')layers.push([`linear-gradient(${ang}deg,${base},${bg.color2||base})`,'100% 100%']);
  if(bg.grad==='radial')layers.push([`radial-gradient(circle at 50% 35%,${base},${bg.color2||base})`,'100% 100%']);
  const st={backgroundColor:base,backgroundImage:layers.map(l=>l[0]).join(',')||'none',backgroundSize:layers.map(l=>l[1]).join(',')||'auto',backgroundPosition:layers.map(l=>l[2]||'0 0').join(',')||'0 0',backgroundRepeat:layers.map(l=>l[1]==='100% 100%'?'no-repeat':'repeat').join(',')||'repeat'};
  if(!asText)return st;
  return Object.entries(st).map(([k,v])=>k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())+':'+v).join(';');
}
function applyBg(){
  const L=$('bgLayer'),ph=getPhoto();let custom=false;
  L.style.backgroundImage='';L.style.backgroundColor='';L.style.backgroundSize='';L.style.backgroundPosition='';L.style.backgroundRepeat='';
  if(SET.bg.type==='color'&&SET.bg.color){Object.assign(L.style,bgCss(SET.bg));custom=true}
  if(SET.bg.type==='photo'&&ph){L.style.backgroundImage=`url("${ph}")`;custom=true}

}
function readImage(file,cb,onErr){
  if(!file)return;
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{URL.revokeObjectURL(url);cb(img)};
  img.onerror=()=>{URL.revokeObjectURL(url);onErr()};

}
function loadPhoto(file){

let scanStream=null,scanRAF=0,detector=null,jsQRLoading=null;
function loadJsQR(){if(window.jsQR)return Promise.resolve();if(!jsQRLoading)jsQRLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='lib/jsQR.js';s.onload=res;s.onerror=rej;document.head.append(s)});return jsQRLoading}
function handleScanned(text){
  const tk=CCSync.parseTicket(text);if(tk){tkJoin(tk);return true}
  const pin=CCSync.parsePin(text);if(pin){closeSheet('scanSheet');openPinEnter(pin);return true}
  if(isOldInvite(text)){oldInvite();return true}
  if(/CC1:/.test(text)){try{const g=decodeGroup(text);importGroup(g)}catch(e){toast(e.message)}closeSheet('scanSheet');return true}
  return false;
}
async function decodeFrame(source,w,h){
  if(detector){try{const r=await detector.detect(source);if(r&&r[0])return r[0].rawValue}catch(e){}}
  await loadJsQR();
  const c=decodeFrame.c||(decodeFrame.c=document.createElement('canvas'));
  const s=Math.min(1,900/Math.max(w,h));c.width=Math.round(w*s);c.height=Math.round(h*s);
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(source,0,0,c.width,c.height);
  const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});
  return r&&r.data;
}
async function startScan(){
  $('scanErr').textContent='';openSheet('scanSheet');
  if('BarcodeDetector' in window){try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){detector=null}}
  loadJsQR().catch(()=>{});
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('video');v.srcObject=scanStream;await v.play();
    let busy=false;
    const tick=async()=>{
      if(!scanStream)return;
      if(!busy&&v.readyState>=2){busy=true;const txt=await decodeFrame(v,v.videoWidth,v.videoHeight).catch(()=>null);busy=false;if(txt&&handleScanned(txt))return}
      scanRAF=requestAnimationFrame(tick);
    };tick();
  }catch(e){$('scanErr').textContent=t('cameraErr')}
}
function stopScan(){cancelAnimationFrame(scanRAF);if(scanStream){scanStream.getTracks().forEach(tr=>tr.stop());scanStream=null}const v=$('video');if(v)v.srcObject=null}

});

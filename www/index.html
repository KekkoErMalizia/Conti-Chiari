<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Conti Chiari</title>
<meta name="description" content="Split group expenses and see who owes whom. Dividi le spese di gruppo.">
<meta name="theme-color" content="#1f5f6b" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1a1e" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Conti Chiari">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<script>
/* Telefoni troppo vecchi: invece di una pagina bianca, un messaggio che spiega cosa aggiornare. Scritto in JavaScript vecchio apposta. */
(function(){
  // globalThis esiste solo da Chrome 71 / Safari 12.1: serve a lib/secp256k1.js (WebView di Android 7 con Chrome 67-70)
  if(typeof globalThis==='undefined')window.globalThis=window;
  var ok=typeof BigInt==='function'&&typeof Promise==='function'&&typeof TextEncoder==='function'&&window.crypto&&crypto.getRandomValues;
  if(ok)return;
  var it=(navigator.language||'').slice(0,2)==='it';
  var ios=/iPhone|iPad|iPod/.test(navigator.userAgent);
  var msg=it?(ios?'Questo iPhone ha una versione di Safari troppo vecchia per Conti Chiari. Aggiorna iOS (Impostazioni \u2192 Generali \u2192 Aggiornamento software) e riapri la pagina.'
                 :'Questo telefono ha una versione di Chrome troppo vecchia per Conti Chiari. Aggiorna dal Play Store \u00abGoogle Chrome\u00bb e \u00abAndroid System WebView\u00bb, poi riapri l\u2019app.')
            :(ios?'This iPhone has a Safari version too old for Conti Chiari. Update iOS (Settings \u2192 General \u2192 Software Update) and reopen the page.'
                 :'This phone has a Chrome version too old for Conti Chiari. Update \u201cGoogle Chrome\u201d and \u201cAndroid System WebView\u201d from the Play Store, then reopen the app.');
  window.CC_OLD=true;
  document.addEventListener('DOMContentLoaded',function(){
    document.body.innerHTML='<div style="font:17px/1.5 sans-serif;padding:32px 24px;max-width:480px;margin:0 auto;color:#14262e;background:#eef2f1"><h1 style="font-size:22px">Conti Chiari</h1><p></p></div>';
    document.body.style.background='#eef2f1';
    document.body.getElementsByTagName('p')[0].appendChild(document.createTextNode(msg));
  });
})();
</script>
<style>
/* Layout: app a schermo intero — barra superiore col gruppo, contenuto scorrevole su sfondo personalizzabile, barra a cinque schede in basso */
:root{
  --bg:#eef2f1; --surface:#ffffff; --ink:#14262e; --muted:#5b6f76; --line:#d5dfdd;
  --accent:#1f5f6b; --accent-ink:#ffffff; --gold:#a8770a; --gold-soft:#f6ecd2;
  --pos:#1d7a4f; --neg:#b3402d; --chip:#e3ebea; --scrim:rgba(10,20,24,.45); --mine:#d9ecef;
  --bar:var(--surface);
  --f-display:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif;
  --f-body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans",sans-serif;
  --f-mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
  --top:env(safe-area-inset-top,0px); --bot:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1a1e; --surface:#16252b; --ink:#e4eeed; --muted:#93a8ad; --line:#26393f;
  --accent:#5fb3bf; --accent-ink:#0b1619; --gold:#e3b54a; --gold-soft:#2c2614;
  --pos:#5cc795; --neg:#ef8a74; --chip:#20343a; --scrim:rgba(0,0,0,.6); --mine:#1d3b42; color-scheme:dark}}

[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.app{position:relative;z-index:1;height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}

#bgLayer{position:fixed;inset:0;z-index:0;background-color:var(--bg);background-size:cover;background-position:center}
body.custom-bg{--bar:var(--surface)}
body.custom-bg .top,body.custom-bg nav.tabs{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
body.custom-bg section{box-shadow:0 4px 18px rgba(0,0,0,.12)}

.top{padding:calc(var(--top) + 10px) 16px 12px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.gbtn{all:unset;cursor:pointer;min-width:0;display:block}
.gbtn .lbl{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:6px}
.gbtn .nm{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.2;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.gbtn .nm span{overflow:hidden;text-overflow:ellipsis}
.gbtn .nm svg{flex:none;opacity:.6}
.gbtn:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.net{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted)}
.net.on{background:var(--pos)}
.tot{text-align:end;flex:none}
.tot .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tot .v{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}

main{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 28px}
.view{max-width:640px;margin:0 auto;display:grid;gap:16px}
section{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;min-width:0}
h2{font-family:var(--f-display);font-weight:700;font-size:18px;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 .count{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted);background:var(--chip);border-radius:999px;padding:1px 9px}
h2 .count:empty{display:none}
.empty{color:var(--muted);font-size:15px;margin:4px 0}
.note{background:var(--gold-soft);border:1px solid var(--gold);border-radius:12px;padding:12px 14px;font-size:14px}
.badge-line{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--pos)}

nav.tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--bar);border-top:1px solid var(--line);padding-bottom:var(--bot)}
nav.tabs button{all:unset;cursor:pointer;position:relative;display:grid;justify-items:center;gap:2px;padding:9px 2px 8px;font-size:11px;font-weight:600;color:var(--muted);text-align:center;min-width:0}
nav.tabs button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px;border-radius:10px}
nav.tabs svg{width:24px;height:24px}
nav.tabs .unread{position:absolute;top:5px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--neg);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
nav.tabs .unread:empty{display:none}

label.f{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px}
input[type=text],input[type=search],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px}
textarea{min-height:110px;font-family:var(--f-mono);font-size:13px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:11px 16px;font-weight:600;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
a.btn{color:inherit;text-decoration:none}
/* tasto «Scarica l'app Android»: contorno luminoso che pulsa con regolarità per attirare l'occhio */
#dlApk{animation:apkGlow 2.2s ease-in-out infinite}
@keyframes apkGlow{0%,100%{box-shadow:0 0 0 0 rgba(31,95,107,.55),0 0 0 0 rgba(31,95,107,.25)}50%{box-shadow:0 0 0 4px rgba(31,95,107,.45),0 0 22px 8px rgba(31,95,107,.45)}}
@media (prefers-color-scheme:dark){@keyframes apkGlow{0%,100%{box-shadow:0 0 0 0 rgba(95,179,191,.5),0 0 0 0 rgba(95,179,191,.2)}50%{box-shadow:0 0 0 4px rgba(95,179,191,.45),0 0 22px 8px rgba(95,179,191,.45)}}}
@media (prefers-reduced-motion:reduce){#dlApk{animation:none}}
.iossteps{list-style:none;margin:4px 0 12px;padding:0;display:grid;gap:14px}
.iossteps li{display:flex;align-items:center;gap:14px;font-size:16px}
.iossteps .ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--chip);color:var(--accent);display:grid;place-items:center}
.iossteps .ic svg{width:24px;height:24px}
.iossteps .ic img{width:44px;height:44px;border-radius:12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--neg)}
.btn.small{padding:7px 12px;font-size:14px}
.btn.block{width:100%}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 130px;min-width:0}
.row>.btn{flex:0 0 auto}
.stack{display:grid;gap:12px}
.err{color:var(--neg);font-size:14px;margin:0}
.err:empty{display:none}
.hint{font-size:13px;color:var(--muted);margin:0}

.fab{position:fixed;inset-inline-end:16px;bottom:calc(var(--bot) + 76px);z-index:5;width:58px;height:58px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px rgba(0,0,0,.22);display:grid;place-items:center;cursor:pointer}
.fab svg{width:28px;height:28px}

/* movimenti */
.filters{display:grid;gap:10px}
.newgroup .row>*{flex:1 1 120px;min-width:0}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .btn{min-height:56px;font-size:15.5px;line-height:1.2;padding:10px 12px}
.quick .btn svg{width:22px;height:22px}
#expForm[data-kind=pay] .only-exp,#expForm:not([data-kind=pay]) .only-pay{display:none}
.filters .row>*{flex:1 1 120px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:8px 4px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg button:focus-visible{outline:2px solid var(--accent)}
.seg button:disabled{opacity:.4;cursor:default}
.sums{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.sums b{font-family:var(--f-mono)}
.exp{list-style:none;margin:0;padding:0}
.exp li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:2px 10px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.exp li:first-child{border-top:0;padding-top:2px}
.exp .ic{grid-row:1/span 2;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--chip);color:var(--muted)}
.exp .ic svg{width:18px;height:18px}
.exp .ic.in{color:var(--pos)}
.exp .ic.out{color:var(--neg)}
.exp .d{font-weight:600;overflow-wrap:anywhere}
.exp .m{grid-column:2;font-size:13px;color:var(--muted)}
.exp .a{grid-row:1/span 2;grid-column:3;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:end}
.exp .a small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.icon-btn{all:unset;cursor:pointer;grid-row:1/span 2;grid-column:4;width:36px;height:36px;display:grid;place-items:center;border-radius:10px;color:var(--muted);font-size:22px}
.icon-btn:focus-visible{outline:2px solid var(--accent)}
.day{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 2px}
.day:first-child{margin-top:0}

/* persone e avatar */
.people{display:flex;flex-wrap:wrap;gap:8px}
.person{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding-block:4px;padding-inline:4px 4px;font-weight:500}
.person .nm{padding-inline-end:2px}
.person button{all:unset;cursor:pointer;color:var(--muted);padding:2px 9px;font-size:18px;line-height:1}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;background-size:cover;background-position:center;overflow:hidden}
.av.lg{width:44px;height:44px;font-size:18px}
.av.xl{width:84px;height:84px;font-size:32px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.members{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.members li{display:flex;gap:12px;align-items:center}
.members .who{min-width:0}
.members .who b{display:block}
.members .who span{display:block;font-size:14px;color:var(--muted);overflow-wrap:anywhere}

/* divisione */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:15px;cursor:pointer;user-select:none}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.focus{outline:2px solid var(--accent);outline-offset:2px}
.chiprow{display:flex;justify-content:space-between;align-items:baseline}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.preview{font-size:14px;color:var(--muted);font-family:var(--f-mono)}
.amountwrap{position:relative}
.amountwrap .cur{position:absolute;inset-inline-end:12px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:14px;color:var(--muted);pointer-events:none}
.amountwrap input{padding-inline-end:56px}

/* saldi */
.bal{display:grid;gap:12px}
.b{display:grid;grid-template-columns:minmax(0,6.5em) 1fr auto;gap:10px;align-items:center;font-size:15px}
.b .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.b .bar{position:relative;height:10px;background:var(--chip);border-radius:5px;direction:ltr}
.b .bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted);opacity:.5}
.b .fill{position:absolute;top:0;bottom:0;border-radius:5px}
.b .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;min-width:6.5em;text-align:end;white-space:nowrap}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.settle{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.settle li{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:12px;border:1px dashed var(--line);border-radius:12px}
.settle .who{font-weight:600}
.settle .arrow{color:var(--muted);font-size:14px}
.settle .amt{margin-inline-start:auto;font-family:var(--f-mono);font-weight:600;font-variant-numeric:tabular-nums;color:var(--gold);white-space:nowrap}

/* chat */
#v-chat{min-height:100%;grid-template-rows:auto 1fr auto}
.e2e{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
.e2e svg{width:14px;height:14px}
.msgs{display:grid;gap:6px;align-content:end}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{margin-inline-start:auto;flex-direction:row-reverse}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px;min-width:0}
.msg.me .bub{background:var(--mine);border-color:transparent}
.msg .au{font-size:12px;font-weight:700;color:var(--accent)}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
.msg .tm{font-size:11px;color:var(--muted);text-align:end}
.msg.cont .av{visibility:hidden}
.msg.cont .au{display:none}
.chathead{display:grid;gap:10px}
.chathead .row{align-items:center}
.ephsel{display:flex;align-items:center;gap:6px;background:var(--chip);border-radius:999px;padding:4px 6px 4px 12px;flex:0 0 auto!important}
.ephsel svg{width:16px;height:16px;flex:none;color:var(--accent)}
.ephsel select{border:0;background:transparent;padding:4px 2px;font-size:14px;font-weight:600;width:auto}
.ephnote{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted);text-align:center}
.ephnote svg{width:13px;height:13px}
.sysmsg{text-align:center;font-size:12.5px;color:var(--muted);background:var(--chip);border-radius:10px;padding:5px 10px;justify-self:center;max-width:90%}
.dmhead{display:flex;align-items:center;gap:10px}
.chatdel{width:40px;height:40px;display:grid;place-items:center;color:var(--neg);flex:none}
.chatdel svg{width:21px;height:21px}
.dmhead .back{all:unset;cursor:pointer;width:40px;height:40px;display:grid;place-items:center;border-radius:12px;color:var(--accent)}
.dmhead .back svg{width:24px;height:24px}
[dir=rtl] .dmhead .back svg{transform:scaleX(-1)}
.dmhead b{display:block}
.dmhead span{display:block;font-size:13px;color:var(--muted)}
.dmlist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.dmlist button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;gap:12px;align-items:center;padding:10px;border-radius:14px}
.dmlist button:hover{background:var(--chip)}
.dmlist button:focus-visible{background:var(--chip)}
.dmlist .who{min-width:0;flex:1}
.dmlist .who b{display:block}
.dmlist .who span{display:block;font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dmlist .meta{display:grid;justify-items:end;gap:4px;font-size:12px;color:var(--muted)}
.badge{min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;display:inline-grid;vertical-align:middle;box-sizing:border-box;place-items:center;padding:0 6px}
.msg .tm{display:flex;justify-content:flex-end;align-items:center;gap:4px}
.ticks{display:inline-flex;width:18px;height:12px;color:var(--muted)}
.ticks.read{color:#2fa8e8}
.ticks svg{width:18px;height:12px}
.msg .eph{width:11px;height:11px;opacity:.7}
.members li[data-dm]{cursor:pointer;border-radius:12px}
.members li[data-dm]:hover{background:var(--chip)}
.seg .badge{margin-inline-start:4px}
.members .dmbtn{margin-inline-start:auto;flex:none}
.chatbar{position:sticky;bottom:-28px;padding-block:8px 28px;margin-bottom:-28px;display:flex;gap:8px;background:linear-gradient(transparent,var(--bg) 30%)}
body.custom-bg .chatbar{background:none}
.chatbar textarea{min-height:46px;max-height:140px;font-family:var(--f-body);font-size:16px;border-radius:22px;padding:11px 16px;resize:none;background:var(--surface)}
.chatbar .btn{border-radius:50%;width:46px;height:46px;padding:0;align-self:flex-end}

/* impostazioni */
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{all:unset;cursor:pointer;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);box-shadow:inset 0 0 0 3px var(--surface)}
.sw[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface),0 0 0 2px var(--accent)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.custom{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}
.custom input[type=color]{width:52px;height:44px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px;cursor:pointer}
.thumb{width:100%;aspect-ratio:16/10;max-width:100%;border-radius:12px;background:var(--chip) center/cover no-repeat;border:1px solid var(--line)}
.prof{display:flex;gap:16px;align-items:center}

/* QR */
.qrbox{display:grid;justify-items:center;gap:12px}
.qrbox canvas{width:240px;height:240px;max-width:100%;border-radius:12px;background:#fff;image-rendering:pixelated}
.scan{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:16px;overflow:hidden;background:#000}
.scan video{width:100%;height:100%;object-fit:cover;display:block}
.scan::after{content:"";position:absolute;inset:18%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}

/* gruppi */
.glist{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.glist button{all:unset;box-sizing:border-box;cursor:pointer;width:100%;display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px;border-radius:12px;border:1px solid var(--line)}
.glist button[aria-current="true"]{border-color:var(--accent);background:var(--chip)}
.glist button:focus-visible{outline:2px solid var(--accent)}
.glist .gm{font-size:13px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.glist .gn{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:6px}

.sheet{position:fixed;inset:0;bottom:var(--kb,0px);z-index:20;display:grid;align-items:end;background:var(--scrim)}
.sheet .panel{background:var(--surface);border-radius:20px 20px 0 0;max-height:calc(100% - var(--top) - 24px);overflow-y:auto;padding:8px 16px calc(var(--bot) + 20px);width:100%;max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet h3{font-family:var(--f-display);font-size:20px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center}
.confirm{display:grid;gap:10px;padding:12px;border:1px solid var(--neg);border-radius:12px}

.toast{position:fixed;left:50%;bottom:calc(var(--bot) + 84px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;z-index:30;max-width:calc(100% - 32px);text-align:center}

/* tutorial interattivo */
#tour{position:fixed;inset:0;z-index:40}
#tour .ring{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(4,14,17,.74),0 0 0 3px var(--gold);transition:all .35s cubic-bezier(.2,.8,.2,1);pointer-events:auto;cursor:pointer}
#tour .ring.none{left:50%!important;top:45%!important;width:0!important;height:0!important;box-shadow:0 0 0 9999px rgba(4,14,17,.8)}
#tour .skip{position:fixed;top:calc(var(--top) + 12px);inset-inline-end:14px;z-index:2;border:0;border-radius:999px;background:#fff;color:#14262e;font-weight:800;font-size:17px;padding:12px 20px;box-shadow:0 6px 20px rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;cursor:pointer}
#tour .skip:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#tour .tcard{position:fixed;left:16px;right:16px;max-width:460px;margin:0 auto;background:var(--surface);color:var(--ink);border-radius:20px;padding:18px 18px 16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:grid;gap:10px;transition:top .35s,bottom .35s}
#tour .tcard h3{font-family:var(--f-display);font-size:21px;margin:0}
#tour .tcard p{margin:0;font-size:15.5px;color:var(--muted);line-height:1.45}
#tour .tstep{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
#tour .dots{display:flex;gap:6px}
#tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
#tour .dots i.on{background:var(--accent);width:18px;border-radius:4px}
#tour .tnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
#tour .remember{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink);cursor:pointer;padding-top:4px;border-top:1px solid var(--line)}
#tour .remember input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.vidwrap{width:100%;max-width:420px;margin:0 auto;aspect-ratio:9/16;max-height:calc(100vh - var(--top) - 160px);background:#000;border-radius:16px;overflow:hidden}
.vidwrap video{width:100%;height:100%;object-fit:contain;display:block}

/* ---------- accessibilità ---------- */
input.switch{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .2s;margin:0}
input.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
input.switch:checked{background:var(--accent)}
input.switch:checked::after{transform:translateX(22px)}
[dir=rtl] input.switch:checked::after{transform:translateX(-22px)}
input.switch:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:600}
.range{display:grid;gap:6px}
.range label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--muted)}
.range output{font-family:var(--f-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--accent);height:28px;margin:0}
.subtle{display:grid;gap:12px;padding:12px;border-radius:12px;background:var(--chip)}
html.a-hc{--bg:#000;--surface:#000;--ink:#fff;--muted:#f0f0f0;--line:#fff;--accent:#ffd400;--accent-ink:#000;--chip:#1c1c1c;--gold:#ffd400;--gold-soft:#1c1c1c;--pos:#5dff9a;--neg:#ff7b7b;--mine:#262626;--bar:#000;color-scheme:dark}
html.a-hc section,html.a-hc .btn,html.a-hc input,html.a-hc select,html.a-hc textarea{border-width:2px}
html.a-hc :focus-visible{outline:3px solid #ffd400!important;outline-offset:3px}
html.a-hc .empty,html.a-hc .hint,html.a-hc .m{color:#fff}
html.a-big .btn,html.a-big button,html.a-big select,html.a-big input[type=text],html.a-big input[type=search]{min-height:48px}
html.a-big body{font-weight:500}
html.a-big nav.tabs button{font-size:12.5px}
html.a-cb-rg{--pos:#0072b2;--neg:#d55e00}
@media (prefers-color-scheme:dark){html.a-cb-rg{--pos:#56b4e9;--neg:#e69f00}}
html.a-cb-by{--pos:#117733;--neg:#cc3311;--gold:#aa3377;--gold-soft:#f6dce9}
@media (prefers-color-scheme:dark){html.a-cb-by{--pos:#44bb99;--neg:#ee6677;--gold:#ee99cc;--gold-soft:#3a2131}}
html.a-mono body{filter:grayscale(1)}
html.a-photo{--bg:#0b1012;--surface:#12191b;--ink:#c9d2d2;--muted:#86969a;--line:#223034;--accent:#6fa3ab;--accent-ink:#0b1012;--chip:#1a2427;--gold:#b8995a;--gold-soft:#221e14;--pos:#7fb894;--neg:#c98a7c;--mine:#18292d;--bar:#12191b;color-scheme:dark}
html.a-photo body{filter:brightness(.88)}
html.a-rm *,html.a-rm *::before,html.a-rm *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media (prefers-reduced-motion:no-preference){.sheet .panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
@media (min-width:700px){.fab{inset-inline-end:calc(50% - 300px)}}
/* Telefoni vecchi (2016 circa): colori semitrasparenti solo dove il browser li sa calcolare, misure fisse al posto di aspect-ratio */
@supports (color:color-mix(in srgb,red 50%,blue)){
  body.custom-bg{--bar:color-mix(in srgb,var(--surface) 86%,transparent)}
  .exp .ic.in{background:color-mix(in srgb,var(--pos) 16%,transparent)}
  .exp .ic.out{background:color-mix(in srgb,var(--neg) 14%,transparent)}
}
@supports not (aspect-ratio:1){
  .thumb{height:56vw;max-height:260px}
  .scan{height:80vw;max-height:420px}
  .vidwrap{height:70vh}
}
</style>

<script>
'use strict';
const KEY='conti-chiari-app-v1', SKEY='conti-chiari-settings', PKEY='conti-chiari-photo';
const COLORS=['#1f5f6b','#c08a12','#8a4fa3','#2f8a5a','#c2543e','#3b6fc4','#9a6b2f','#4d8f9c'];
const BG_SWATCHES=['#e8dfd0','#d6ece2','#d7e4f4','#e6dff4','#f6dcdc','#fbeec4','#3a4a50','#1d2b44','#101418'];
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const IC={
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  in:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M17 7L7 17M15 17H7V9"/></svg>',
  exp:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/></svg>',
  pay:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>'
};

/* ---------- impostazioni e lingua ---------- */
let SET={lang:'auto',bg:{type:'default',color:'#d6ece2'},profile:{name:'',status:'',avatar:''},sound:true,vib:true,keepAlive:false,vol:50,vibInt:50,vision:'auto',textSize:50,voiceRate:50,notify:true,receipts:true};
const fx=k=>{try{window.FX&&FX.play(k)}catch(e){}};
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)SET=Object.assign(SET,s,{profile:Object.assign(SET.profile,s.profile||{})})}catch(e){}
const saveSet=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SET))}catch(e){toast(t('storageFull'))}};
function detectLang(){for(const l of (navigator.languages||[navigator.language||'en'])){const c=String(l).toLowerCase().split(/[-_@.]/)[0];if(I18N[c])return c}return 'en'}
let LANG='it',LOCALE='it';
function setLang(){
  LANG=SET.lang!=='auto'&&I18N[SET.lang]?SET.lang:detectLang();
  const nav=String((navigator.languages||[navigator.language||''])[0]||'').split(/[@.]/)[0].replace(/_/g,'-');
  LOCALE=nav.toLowerCase().startsWith(LANG)?nav:LANG;
  try{Intl.getCanonicalLocales(LOCALE);new Intl.NumberFormat(LOCALE)}catch(e){LOCALE=LANG}
  document.documentElement.lang=LANG;document.documentElement.dir=RTL.includes(LANG)?'rtl':'ltr';
}
function t(k,v){let s=(I18N[LANG]&&I18N[LANG][k])??I18N.en[k]??I18N.it[k]??k;if(v)for(const[a,b]of Object.entries(v))s=s.split('{'+a+'}').join(b);return s}
function applyStatic(){
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll('[data-tp]').forEach(e=>e.placeholder=t(e.dataset.tp));
  document.querySelectorAll('[data-ta]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ta)));
}

/* ---------- valute ---------- */
const COMMON_CUR=['EUR','USD','GBP','CHF','JPY','CNY','CAD','AUD','INR','BRL','MXN','TRY','PLN','SEK','NOK','DKK','RON','CZK','HUF','UAH','RUB','KRW','AED','SAR','ZAR','EGP','MAD','THB','SGD','NZD'];
const FALLBACK_CUR=COMMON_CUR.concat(['ARS','BGN','CLP','COP','HKD','IDR','ILS','ISK','KES','KWD','MYR','NGN','PEN','PHP','PKR','QAR','RSD','TWD','VND','BHD','OMR','JOD','TND','DZD','LKR','BDT','GEL','KZT','ALL','MKD','BAM','MDL']);
const ALL_CUR=(()=>{try{const l=Intl.supportedValuesOf('currency');if(l&&l.length)return l}catch(e){}return [...new Set(FALLBACK_CUR)].sort()})();
const REGION_CUR={US:'USD',GB:'GBP',CH:'CHF',JP:'JPY',CN:'CNY',CA:'CAD',AU:'AUD',IN:'INR',BR:'BRL',MX:'MXN',TR:'TRY',PL:'PLN',SE:'SEK',NO:'NOK',DK:'DKK',RO:'RON',CZ:'CZK',HU:'HUF',UA:'UAH',RU:'RUB',KR:'KRW',AE:'AED',SA:'SAR',ZA:'ZAR',EG:'EGP',MA:'MAD',TH:'THB',SG:'SGD',NZ:'NZD',AR:'ARS',CO:'COP',CL:'CLP',PE:'PEN',IL:'ILS',HK:'HKD',TW:'TWD',ID:'IDR',MY:'MYR',PH:'PHP',VN:'VND',NG:'NGN',KE:'KES',PK:'PKR',BD:'BDT',BG:'BGN',RS:'RSD',IS:'ISK'};
function guessCur(){const m=String(navigator.language||'').match(/-([A-Z]{2})\b/i);return (m&&REGION_CUR[m[1].toUpperCase()])||'EUR'}
const digitsCache={};
function curDigits(c){if(!(c in digitsCache)){try{digitsCache[c]=new Intl.NumberFormat('en',{style:'currency',currency:c}).resolvedOptions().maximumFractionDigits}catch(e){digitsCache[c]=2}}return digitsCache[c]}
const fmtCache={};
function fmt(minor,cur){
  cur=cur||G().cur||'EUR';const d=curDigits(cur),k=LOCALE+cur;
  if(!fmtCache[k]){try{fmtCache[k]=new Intl.NumberFormat(LOCALE,{style:'currency',currency:cur,currencyDisplay:'narrowSymbol'})}catch(e){fmtCache[k]=new Intl.NumberFormat(LOCALE,{style:'currency',currency:cur})}}
  return fmtCache[k].format(minor/10**d);
}
function curSymbol(cur){try{return new Intl.NumberFormat(LOCALE,{style:'currency',currency:cur,currencyDisplay:'narrowSymbol'}).formatToParts(0).find(p=>p.type==='currency').value}catch(e){return cur}}
function curName(c){try{return new Intl.DisplayNames([LOCALE],{type:'currency'}).of(c)}catch(e){return c}}
function parseAmount(s,d){
  s=String(s).trim().replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/[۰-۹]/g,c=>c.charCodeAt(0)-1776)
    .replace(/[٫]/g,'.').replace(/[٬\s  ']/g,'').replace(/[^\d.,-]/g,'');
  if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
  if(lc>-1&&ld>-1){const dec=lc>ld?',':'.';s=s.split(dec==','?'.':',').join('').replace(dec,'.')}
  else if(lc>-1||ld>-1){const sep=lc>-1?',':'.',parts=s.split(sep);const thousands=parts.length>2||(parts[1].length===3&&d!==3);s=thousands?parts.join(''):parts[0]+'.'+parts[1]}
  const n=Number(s);return isFinite(n)&&n>=0?Math.round(n*10**d):NaN;
}

/* ---------- dati ---------- */
function blankGroup(o){return Object.assign({id:uid(),name:t('myGroup'),cur:guessCur(),people:[],expenses:[],payments:[],chat:[],members:{},lww:{},dead:{},updated:Date.now()},o)}
function sampleGroup(){
  const names=t('samplePeople').split(','),p=names.map((n,i)=>({id:'p'+i,name:n,color:COLORS[i]})),ids=p.map(x=>x.id);
  return blankGroup({id:'esempio',name:t('sName'),sample:true,lang:LANG,cur:'EUR',people:p,expenses:[
    {id:'e1',desc:t('sApt'),amount:36000,payer:'p0',split:ids,date:'2026-10-03',at:1},
    {id:'e2',desc:t('sFuel'),amount:8740,payer:'p1',split:ids,date:'2026-10-03',at:2},
    {id:'e3',desc:t('sDinner'),amount:13200,payer:'p2',split:ids,date:'2026-10-03',at:3},
    {id:'e4',desc:t('sDrinks'),amount:3150,payer:'p3',split:['p1','p2','p3'],date:'2026-10-04',at:4},
    {id:'e5',desc:t('sMuseum'),amount:4800,payer:'p0',split:['p0','p2','p3'],date:'2026-10-04',at:5}],
    payments:[{id:'y1',from:'p3',to:'p0',amount:5000,date:'2026-10-05',at:6}]});
}
setLang();
let DB;
try{DB=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!DB||!DB.groups||!Object.keys(DB.groups).length){const g=sampleGroup();DB={current:g.id,groups:{[g.id]:g}}}
// migrazione dalle versioni precedenti: i pagamenti spuntati diventano movimenti veri
Object.values(DB.groups).forEach(g=>{
  ['people','expenses','payments','chat'].forEach(k=>{if(!Array.isArray(g[k]))g[k]=[]});
  ['members','lww','dead'].forEach(k=>{if(!g[k]||typeof g[k]!=='object')g[k]={}});
  if(!g.cur)g.cur='EUR';
  if(g.done){Object.keys(g.done).forEach(k=>{const m=k.match(/^(.+)_(.+)_(\d+)$/);if(m)g.payments.push({id:uid()+Math.random().toString(36).slice(2,5),from:m[1],to:m[2],amount:+m[3],date:today(),at:Date.now()})});delete g.done}
});
if(!DB.groups[DB.current])DB.current=Object.keys(DB.groups)[0];
if(!DB.dms||typeof DB.dms!=='object')DB.dms={};
const G=()=>DB.groups[DB.current];
let saveT;
function persist(){clearTimeout(saveT);saveT=null;try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){toast(t('storageFull'))}}
function persistSoon(){if(!saveT)saveT=setTimeout(persist,400)}
const personIn=(g,id)=>g.people.find(p=>p.id===id);
const person=id=>personIn(G(),id);

/* ---------- operazioni (stesse per gruppi locali e online) ---------- */
const isId=x=>typeof x==='string'&&x.length>0&&x.length<=64;
const isAmt=x=>Number.isInteger(x)&&x>0&&x<1e15;
const isDate=x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x);
function cleanPerson(p){return p&&isId(p.id)&&typeof p.name==='string'?{id:p.id,name:p.name.slice(0,24),color:/^#[0-9a-f]{6}$/i.test(p.color)?p.color:COLORS[0]}:null}
function cleanExp(e){return e&&isId(e.id)&&isAmt(e.amount)&&isId(e.payer)&&Array.isArray(e.split)&&e.split.length&&e.split.length<=200&&e.split.every(isId)?{id:e.id,desc:String(e.desc||'—').slice(0,60),amount:e.amount,payer:e.payer,split:[...new Set(e.split)],date:isDate(e.date)?e.date:today(),at:+e.at||0}:null}
function cleanPay(p){return p&&isId(p.id)&&isAmt(p.amount)&&isId(p.from)&&isId(p.to)&&p.from!==p.to?{id:p.id,from:p.from,to:p.to,amount:p.amount,date:isDate(p.date)?p.date:today(),at:+p.at||0}:null}
const AV_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function applyOp(g,op,pk){
  const ts=+op.ts||0,L=g.lww,D=g.dead;
  const up=(key,arr,obj)=>{if(!obj||(D[key]||0)>ts||(L[key]||0)>ts)return;L[key]=ts;const i=g[arr].findIndex(x=>x.id===obj.id);if(i>=0)g[arr][i]=obj;else g[arr].push(obj)};
  const rm=(key,arr,id)=>{if(!isId(id)||(L[key]||0)>ts)return;D[key]=Math.max(D[key]||0,ts);L[key]=ts;g[arr]=g[arr].filter(x=>x.id!==id)};
  switch(op.t){

    case 'person': up('p:'+(op.p&&op.p.id),'people',cleanPerson(op.p));break;
    case 'person-': rm('p:'+op.id,'people',op.id);break;

    case 'msg': case 'rcpt': case 'eph': case 'clr': return applyChat(g,op,pk);

/* ---------- calcoli ---------- */
function shares(e){const n=e.split.length,b=Math.floor(e.amount/n),r=e.amount-b*n;return e.split.map((id,i)=>[id,b+(i<r?1:0)])}
function balances(g=G()){
  const b={};g.people.forEach(p=>b[p.id]=0);
  g.expenses.forEach(e=>{if(!(e.payer in b)||!e.split.length)return;b[e.payer]+=e.amount;shares(e).forEach(([id,c])=>{if(id in b)b[id]-=c})});
  g.payments.forEach(p=>{if(p.from in b&&p.to in b){b[p.from]+=p.amount;b[p.to]-=p.amount}});
  return b;
}
function settle(b){
  const cr=[],db=[];
  Object.entries(b).forEach(([id,v])=>{if(v>0)cr.push([id,v]);else if(v<0)db.push([id,-v])});
  const tx=[];
  while(cr.length&&db.length){
    cr.sort((a,b)=>b[1]-a[1]);db.sort((a,b)=>b[1]-a[1]);
    const c=cr[0],d=db[0],m=Math.min(c[1],d[1]);
    tx.push({from:d[0],to:c[0],amount:m});c[1]-=m;d[1]-=m;if(!c[1])cr.shift();if(!d[1])db.shift();
  }
  return tx;
}

function b64enc(str){const bytes=new TextEncoder().encode(str);let bin='';bytes.forEach(x=>bin+=String.fromCharCode(x));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function b64dec(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function encodeGroup(g){const{id,name,cur,people,expenses,payments}=g;return 'CC1:'+b64enc(JSON.stringify({id,name,cur,people,expenses,payments}))}
function decodeGroup(code){
  const m=String(code).replace(/\s/g,'').match(/CC1:([A-Za-z0-9_-]+)/);
  if(!m)throw new Error(t('errCodeInvalid'));
  let g;try{g=JSON.parse(b64dec(m[1]))}catch(e){throw new Error(t('errCodeIncomplete'))}
  if(!g||typeof g.name!=='string'||!Array.isArray(g.people)||!Array.isArray(g.expenses))throw new Error(t('errCodeNoGroup'));
  const people=g.people.map(cleanPerson).filter(Boolean),ids=new Set(people.map(p=>p.id));
  const expenses=g.expenses.map(cleanExp).filter(e=>e&&ids.has(e.payer)&&e.split.every(x=>ids.has(x)));
  const payments=(g.payments||[]).map(cleanPay).filter(p=>p&&ids.has(p.from)&&ids.has(p.to));
  return blankGroup({id:isId(g.id)?g.id:uid(),name:g.name.slice(0,40)||t('myGroup'),cur:ALL_CUR.includes(g.cur)?g.cur:'EUR',people,expenses,payments});
}

const EPH=[[0,'ephOff'],[300,'eph5m'],[3600,'eph1h'],[28800,'eph8h'],[86400,'eph24h']];
const ephLabel=s=>t((EPH.find(e=>e[0]===s)||EPH[0])[1]);
let chatView='group',curDM=null;
function nameOf(pk){
  if(pk===ME.pk)return SET.profile.name||t('you');
  let best=null;for(const g of Object.values(DB.groups)){const m=g.members[pk];if(m&&(!best||m.ts>best.ts))best=Object.assign({g},m)}
  if(!best)return t('anon');const p=best.personId&&personIn(best.g,best.personId);return best.name||(p&&p.name)||t('anon');
}
function infoOf(pk){let best=null;for(const g of Object.values(DB.groups)){const m=g.members[pk];if(m&&(!best||m.ts>best.ts))best=m}return best||{}}
function avatarOf(pk,cls){if(pk===ME.pk)return avatarHtml(SET.profile.name||'?',COLORS[0],SET.profile.avatar,cls);const i=infoOf(pk);return avatarHtml(nameOf(pk),'#5b6f76',i.avatar,cls)}
function applyChat(ch,op,pk){
  const ts=+op.ts||0;ch.rcpt=ch.rcpt||{};ch.lww=ch.lww||{};
  if(op.t==='clr'){
    // chat privata: può cancellarla chiunque dei due; chat di gruppo: solo chi ha creato il gruppo online
    if(!ch.peer){
      const own=ch.sync&&ch.sync.owner;
      if(!own){(ch.pendClr=ch.pendClr||[]).push({pk,ts});return}
      if(pk!==own)return;
    }
    if(!(ts>0)||ts>Date.now()+600000||(ch.clr||0)>=ts)return;
    ch.clr=ts;ch.chat=ch.chat.filter(m=>m.ts>ts);
    Object.keys(ch.rcpt).forEach(id=>{if(!ch.chat.some(m=>m.id===id))delete ch.rcpt[id]});
    ch.unread=0;return 'clr';
  }
  if(op.t==='msg'){
    if(!isId(op.id)||typeof op.text!=='string'||!op.text.trim()||ch.chat.some(m=>m.id===op.id))return;
    if(ch.clr&&(+op.ts||0)<=ch.clr)return;
    const exp=+op.exp||0;if(exp&&exp<Date.now())return;
    ch.chat.push({id:op.id,from:pk,text:op.text.slice(0,1000),ts,exp:exp||undefined,sent:pk===ME.pk?0:1});
    ch.chat.sort((a,b)=>a.ts-b.ts);if(ch.chat.length>2000)ch.chat.splice(0,ch.chat.length-2000);
    return 'msg';

    const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let q=.82,data=c.toDataURL('image/jpeg',q);
    while(data.length>1500000&&q>.4){q-=.12;data=c.toDataURL('image/jpeg',q)}
    try{localStorage.setItem(PKEY,data);photoCache=data}catch(e){$('photoErr').textContent=t('storageFull');return}
    SET.bg.type='photo';saveSet();applyBg();renderSettings();
  },()=>$('photoErr').textContent=t('photoErr'));
}
function loadAvatar(file){
  readImage(file,img=>{
    const S=160,c=document.createElement('canvas');c.width=c.height=S;
    const m=Math.min(img.naturalWidth,img.naturalHeight);
    c.getContext('2d').drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,S,S);
    if(myT)flushProfile();
    SET.profile.avatar=c.toDataURL('image/jpeg',.8);saveSet();renderSettings();render();broadcastProfile();
  },()=>toast(t('photoErr')));
}

/* ---------- scansione QR ---------- */
let scanStream=null,scanRAF=0,detector=null,jsQRLoading=null;
function loadJsQR(){if(window.jsQR)return Promise.resolve();if(!jsQRLoading)jsQRLoading=new Promise((res,rej)=>{const s=document.createElement('script');s.src='lib/jsQR.js';s.onload=res;s.onerror=rej;document.head.append(s)});return jsQRLoading}
function handleScanned(text){
  const inv=CCSync.parseInvite(text);
  if(inv){joinGroup(inv);return true}
  if(/CC1:/.test(text)){try{const g=decodeGroup(text);importGroup(g)}catch(e){toast(e.message)}closeSheet('scanSheet');return true}
  return false;
}
async function decodeFrame(source,w,h){
  if(detector){try{const r=await detector.detect(source);if(r&&r[0])return r[0].rawValue}catch(e){}}
  await loadJsQR();
  const c=decodeFrame.c||(decodeFrame.c=document.createElement('canvas'));
  const s=Math.min(1,900/Math.max(w,h));c.width=Math.round(w*s);c.height=Math.round(h*s);
  const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(source,0,0,c.width,c.height);
  const r=jsQR(ctx.getImageData(0,0,c.width,c.height).data,c.width,c.height,{inversionAttempts:'attemptBoth'});
  return r&&r.data;
}
async function startScan(){
  $('scanErr').textContent='';openSheet('scanSheet');
  if('BarcodeDetector' in window){try{detector=new BarcodeDetector({formats:['qr_code']})}catch(e){detector=null}}
  loadJsQR().catch(()=>{});
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('video');v.srcObject=scanStream;await v.play();
    let busy=false;
    const tick=async()=>{
      if(!scanStream)return;
      if(!busy&&v.readyState>=2){busy=true;const txt=await decodeFrame(v,v.videoWidth,v.videoHeight).catch(()=>null);busy=false;if(txt&&handleScanned(txt))return}
      scanRAF=requestAnimationFrame(tick);
    };tick();
  }catch(e){$('scanErr').textContent=t('cameraErr')}
}
function stopScan(){cancelAnimationFrame(scanRAF);if(scanStream){scanStream.getTracks().forEach(tr=>tr.stop());scanStream=null}const v=$('video');if(v)v.srcObject=null}

  readImage(f,async img=>{const txt=await decodeFrame(img,img.naturalWidth,img.naturalHeight).catch(()=>null);if(!(txt&&handleScanned(txt)))$('scanErr').textContent=t('qrNotFound')},()=>$('scanErr').textContent=t('qrNotFound'));
});

let appBuild=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
async function checkUpdate(manual){
  if(!keepPlugin())return;   // solo nell'app Android (il plugin «Background» esiste solo lì)
  try{
    if(!appBuild)appBuild=await (await fetch('build.json',{cache:'no-store'})).json();
    if(!appBuild||!appBuild.build||!appBuild.repo)return;
    $('appVer').textContent=t('appVersion',{n:appBuild.build});$('appVer').hidden=$('updCheck').hidden=false;
    if(!manual&&Date.now()-(+lsGet('cc-upd-check')||0)<6*3600e3)return;
    lsSet('cc-upd-check',Date.now());
    const rel=await (await fetch(`https://api.github.com/repos/${appBuild.repo}/releases/tags/android-latest`,{cache:'no-store'})).json();
    const m=String(rel&&rel.body||'').match(/build:\s*(\d+)/),latest=m?+m[1]:0;
    if(latest>appBuild.build)showUpdate(latest);
    else if(manual)toast(t('updNone'));
  }catch(e){if(manual)toast(t('updFail'))}
}

document.addEventListener('visibilitychange',()=>{if(document.hidden)persist()});



/* ---------- suoni, vibrazione e accessibilità ---------- */
const VISION=[['auto','vmAuto'],['standard','vmStandard'],['low','vmLow'],['contrast','vmContrast'],['protan','vmProtan'],['deutan','vmDeutan'],['tritan','vmTritan'],['mono','vmMono'],['blind','vmBlind'],['photo','vmPhoto']];
function renderA11y(){
  $('notifOn').checked=SET.notify!==false;$('rcptOn').checked=SET.receipts!==false;renderNotifState();renderKeepAlive();
  $('sndOn').checked=SET.sound!==false;$('vibOn').checked=SET.vib!==false;
  $('sndVol').value=SET.vol;$('vibInt').value=SET.vibInt;$('txtSize').value=SET.textSize;$('voiceRate').value=SET.voiceRate;
  $('sndVolOut').textContent=SET.vol+'%';$('vibIntOut').textContent=SET.vibInt+'%';$('txtSizeOut').textContent=SET.textSize+'%';$('voiceRateOut').textContent=SET.voiceRate+'%';
  $('sndVol').disabled=SET.sound===false;$('vibInt').disabled=SET.vib===false;
  $('vibNote').hidden=!!navigator.vibrate;
  $('visionSel').innerHTML=VISION.map(([v,k])=>`<option value="${v}">${esc(t(k))}</option>`).join('');$('visionSel').value=SET.vision||'auto';
  $('voiceRow').hidden=SET.vision!=='blind';
}
function a11ySave(){saveSet();renderA11y();try{FX.applyVision()}catch(e){}}
$('sndOn').onchange=e=>{SET.sound=e.target.checked;a11ySave();if(SET.sound)fx('success')};
$('vibOn').onchange=e=>{SET.vib=e.target.checked;a11ySave();if(SET.vib)fx('success')};
$('sndVol').oninput=e=>{SET.vol=+e.target.value;$('sndVolOut').textContent=SET.vol+'%'};
$('sndVol').onchange=()=>{a11ySave();fx('tap')};
$('vibInt').oninput=e=>{SET.vibInt=+e.target.value;$('vibIntOut').textContent=SET.vibInt+'%'};
$('vibInt').onchange=()=>{a11ySave();fx('success')};
$('txtSize').oninput=e=>{SET.textSize=+e.target.value;$('txtSizeOut').textContent=SET.textSize+'%'};
$('txtSize').onchange=()=>a11ySave();
$('voiceRate').oninput=e=>{SET.voiceRate=+e.target.value;$('voiceRateOut').textContent=SET.voiceRate+'%'};
$('voiceRate').onchange=()=>{a11ySave();try{FX.speak(t('voiceRate'))}catch(e){}};
$('visionSel').onchange=e=>{SET.vision=e.target.value;a11ySave();try{FX.speak(e.target.selectedOptions[0].textContent)}catch(e){}};
$('testFx').onclick=()=>{['tap','tab','open','success','pay','send','receive','delete','error'].forEach((k,i)=>setTimeout(()=>fx(k),i*380))};

/* ---------- video dimostrativo ---------- */
$('openVideo').onclick=()=>{
  const v=$('demoVideo');$('videoErr').textContent='';
  if(!v.src)v.src='video/ContiChiari-promo.mp4';
  openSheet('videoSheet');v.play().catch(()=>{});

document.getElementById('videoSheet').addEventListener('click',e=>{if(e.target.id==='videoSheet'||e.target.hasAttribute('data-close'))$('demoVideo').pause()});

/* ---------- tutorial interattivo ---------- */
const TOUR=[
  {t:'t1t',b:'t1b'},
  {sel:'#openGroups',tab:'mov',t:'t2t',b:'t2b'},
  {sel:'nav [data-tab=gruppo]',t:'t3t',b:'t3b'},
  {sel:'#fab',tab:'mov',t:'t4t',b:'t4b'},
  {sel:'nav [data-tab=saldi]',t:'t5t',b:'t5b'},
  {sel:'#q',tab:'mov',t:'t6t',b:'t6b'},
  {sel:'nav [data-tab=chat]',t:'t7t',b:'t7b'},
  {sel:'nav [data-tab=impostazioni]',t:'t8t',b:'t8b'},
  {t:'t9t',b:'t9b'}];
let tourI=0;
function tourShow(i){
  tourI=Math.max(0,Math.min(TOUR.length-1,i));const st=TOUR[tourI];
  if(st.tab&&tab!==st.tab)setTab(st.tab);
  $('tStep').textContent=t('tStep',{n:tourI+1,total:TOUR.length});
  $('tTitle').textContent=t(st.t);$('tBody').textContent=t(st.b);
  $('tDots').innerHTML=TOUR.map((_,k)=>`<i class="${k===tourI?'on':''}"></i>`).join('');
  $('tBack').hidden=tourI===0;$('tNext').textContent=t(tourI===TOUR.length-1?'tDone':'tNext');
  const ring=$('tRing'),card=$('tCard'),el=st.sel&&document.querySelector(st.sel);
  if(el&&el.getClientRects().length&&!el.closest('[hidden]')){
    const r=el.getBoundingClientRect(),pad=6;
    ring.classList.remove('none');
    Object.assign(ring.style,{left:r.left-pad+'px',top:r.top-pad+'px',width:r.width+pad*2+'px',height:r.height+pad*2+'px'});
    const below=r.top+r.height/2<innerHeight/2;
    if(below){card.style.top=Math.min(innerHeight-260,r.bottom+18)+'px';card.style.bottom='auto'}
    else{card.style.bottom=Math.max(16,innerHeight-r.top+18)+'px';card.style.top='auto'}
  }else{ring.classList.add('none');card.style.top='auto';card.style.bottom='max(24px, calc(var(--bot) + 24px))'}
}
function tourOpen(){$('tRemember').checked=!!SET.tutorialDone;$('tour').hidden=false;tourShow(0);$('tNext').focus()}
function tourClose(){
  SET.tutorialDone=$('tRemember').checked;saveSet();
  $('tour').hidden=true;setTab('mov');
}
$('tNext').onclick=()=>tourI===TOUR.length-1?tourClose():tourShow(tourI+1);
$('tBack').onclick=()=>tourShow(tourI-1);
$('tSkip').onclick=tourClose;
$('tRing').onclick=()=>tourI===TOUR.length-1?tourClose():tourShow(tourI+1);   // toccare la zona evidenziata fa andare avanti
document.addEventListener('keydown',e=>{if($('tour').hidden)return;if(e.key==='Escape')tourClose();if(e.key==='ArrowRight')$('tNext').click();if(e.key==='ArrowLeft'&&tourI>0)tourShow(tourI-1)});
addEventListener('resize',()=>{if(!$('tour').hidden)tourShow(tourI)});
$('openTour').onclick=tourOpen;
// sito aperto da iPhone/iPad e non ancora installato: pulsante con i passi per aggiungerlo alla schermata Home
(function(){
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(/Macintosh/.test(navigator.userAgent)&&navigator.maxTouchPoints>1);
  const installed=navigator.standalone===true||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
  if(window.Capacitor||!ios||installed)return;
  const safari=!/CriOS|FxiOS|EdgiOS|OPiOS|GSA\//.test(navigator.userAgent);
  $('iosInstall').hidden=false;$('iosNotSafari').hidden=safari;
  $('iosInstall').onclick=()=>openSheet('iosSheet');
})();
// sito aperto da un telefono Android (non dall'app): link diretto all'APK della Release «android-latest» del repository
(function(){
  if(window.Capacitor||!/Android/i.test(navigator.userAgent)||!/\.github\.io$/.test(location.hostname))return;
  const owner=location.hostname.split('.')[0],repo=location.pathname.split('/')[1];if(!repo)return;
  const url=`https://github.com/${owner}/${repo}/releases/download/android-latest/ContiChiari.apk`;
  $('dlApk').href=$('apkGo').href=url;
  $('dlApk').hidden=$('dlApkHint').hidden=false;
  // prima del download, i passi da seguire (cache del Play Store, «Installa comunque»)
  $('dlApk').onclick=e=>{e.preventDefault();openSheet('apkSheet')};
  $('apkGo').onclick=()=>setTimeout(()=>closeSheet('apkSheet'),300);
  // l'APK è la strada consigliata: niente banner «Installa app» di Chrome (crea una WebAPK tramite il Play Store)
  window.addEventListener('beforeinstallprompt',ev=>ev.preventDefault());
})();
(function(){const m=location.hash.match(/^#chat=(.+)$/);if(m){history.replaceState(null,'',location.pathname+location.search);setTimeout(()=>openChan(decodeURIComponent(m[1])),50)}})();
if(!SET.tutorialDone&&!CCSync.parseInvite(location.hash)&&!/^#chat=/.test(location.hash))setTimeout(tourOpen,350);

/* ---------- offline ---------- */
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

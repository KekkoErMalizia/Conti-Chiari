# Pubblica l'app web installabile (Android e iPhone) su GitHub Pages.
# Una volta sola: Settings → Pages → Source: "GitHub Actions".
name: App web (iPhone e Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Converti per i telefoni vecchi (Chrome 67+, Safari 14+)
        run: npm install --no-save esbuild@0.24.2 lightningcss@1.28.2 && npm run compat
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deployment
        uses: actions/deploy-pages@v4

# Costruisce l'APK Android a ogni modifica (o a mano da "Actions → Run workflow").
# Il file da installare si trova in fondo alla pagina dell'esecuzione, sotto "Artifacts".
name: App Android (APK)

on:
  push:
    branches: [main, 'ccr-*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installa le dipendenze
        run: npm install

      - name: Converti per i telefoni vecchi (Chrome 67+, Safari 14+)
        run: npm run compat

      - name: Crea il progetto Android e le icone
        run: npm run android

      - name: Rilevatore di arresti (mostra il motivo se l'app si chiude all'avvio)
        run: |
          D=$(dirname "$(find android/app/src/main/java -name MainActivity.java)")
          cp android-extra/*.java "$D"/
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<application android:name=".CrashGuard"#' $M
          sed -i 's#<category android:name="android.intent.category.LAUNCHER" />##' $M
          sed -i 's#</application>#    <activity android:name=".StartActivity" android:process=":crash" android:exported="true" android:theme="@android:style/Theme.Translucent.NoTitleBar">\n            <intent-filter>\n                <action android:name="android.intent.action.MAIN" />\n                <category android:name="android.intent.category.LAUNCHER" />\n            </intent-filter>\n        </activity>\n        <activity android:name=".CrashActivity" android:process=":crash" android:exported="false" android:theme="@android:style/Theme.DeviceDefault.Light" />\n    </application>#' $M
          cat $M

      - name: Niente font emoji scaricato dai Servizi Google Play all'avvio
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android"#<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools"#' $M
          sed -i 's#</application>#    <provider android:name="androidx.startup.InitializationProvider" android:authorities="${applicationId}.androidx-startup" android:exported="false" tools:node="merge">\n            <meta-data android:name="androidx.emoji2.text.EmojiCompatInitializer" tools:node="remove" />\n        </provider>\n    </application>#' $M
          grep -n "tools:\|EmojiCompat" $M

      - name: Attività in background (servizio in primo piano per le notifiche a schermo spento)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</application>#    <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="remoteMessaging" />\n    </application>#' $M
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_REMOTE_MESSAGING" />\n    <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n</manifest>#' $M
          grep -n "KeepAlive\|FOREGROUND\|BATTERY" $M

      - name: Permesso fotocamera (scansione QR)
        run: sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' android/app/src/main/AndroidManifest.xml && grep -n CAMERA android/app/src/main/AndroidManifest.xml

      - name: Compila l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rinomina il file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ContiChiari.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ContiChiari-android
          path: ContiChiari.apk
          retention-days: 30

  # Prova l'APK su telefoni Android 6 e 7 simulati: lo avvia due volte e salva registro (logcat) e schermate.
  # Serve a vedere il motivo degli arresti all'avvio senza un telefono collegato al computer.
  prova-telefoni-vecchi:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 24]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ContiChiari-android

      - name: Attiva la virtualizzazione (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Avvia l'app su Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86
          target: google_apis
          disable-animations: true
          script: |
            adb install -r ContiChiari.apk
            adb logcat -c
            adb shell monkey -p it.contichiari.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb exec-out screencap -p > schermata-1.png
            adb shell monkey -p it.contichiari.app -c android.intent.category.LAUNCHER 1
            sleep 15
            adb exec-out screencap -p > schermata-2.png
            adb logcat -d -v time > logcat.txt
            adb shell pm list packages -f | grep -i -E "webview|chrome" > webview.txt || true
            adb shell dumpsys package com.google.android.webview | grep -i versionName >> webview.txt || true
            adb shell dumpsys package com.android.chrome | grep -i versionName >> webview.txt || true

      - name: Riepilogo errori
        if: always()
        run: |
          cat webview.txt || true
          echo "===== errori ====="
          grep -n -E "FATAL|AndroidRuntime|Exception|Error|chromium|cr_|contichiari|Capacitor|ActivityManager: (Start|Process|Force)|DEBUG|libc|tombstone" logcat.txt | head -300 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prova-android-api-${{ matrix.api-level }}
          path: |
            logcat.txt
            webview.txt
            schermata-*.png
          retention-days: 14
